apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-public
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: k8s/infrastructure/grafana-public
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: kube-prometheus-stack
