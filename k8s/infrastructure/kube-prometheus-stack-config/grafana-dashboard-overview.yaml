          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "bargauge",
          "title": "Memory usage vs requests (namespace)",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 22
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(12, 100 * sum by (namespace) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\",namespace!=\"\"}) / sum by (namespace) (kube_pod_container_resource_requests{resource=\"memory\",unit=\"byte\"}))",
