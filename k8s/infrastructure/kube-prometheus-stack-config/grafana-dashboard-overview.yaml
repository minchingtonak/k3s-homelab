        {
          "type": "row",
          "title": "Alerts",
          "id": 101,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "table",
          "title": "Currently firing",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 10,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor\"}",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "alertstate": true,
                  "job": true,
                  "instance": true,
                  "uid": true,
                  "type": true,
                  "key": true,
                  "Value": true
                },
                "indexByName": {
                  "alertname": 0,
                  "severity": 1,
                  "namespace": 2,
                  "pod": 3,
                  "persistentvolumeclaim": 1
                },
                "renameByName": {
                  "Value": "",
                  "alertname": "Alert",
                  "namespace": "Namespace",
                  "severity": "Severity",
                  "pod": "Pod",
                  "persistentvolumeclaim": "PVC",
                  "name": "Endpoint"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "type": "timeseries",
