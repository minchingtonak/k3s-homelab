apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-tsdb-storage
  namespace: monitoring
spec:
  groups:
    - name: prometheus.storage
      rules:
        - alert: PrometheusStorageFillingUp
          expr: (time() - prometheus_tsdb_lowest_timestamp_seconds) / 86400 < 45
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Prometheus TSDB effective retention down to {{ $value | humanize }} days"
            description: >
              Prometheus ({{ $labels.job }}) is size-capped and evicting its
              oldest blocks; effective retention has eroded below 45d of the
              configured 90d. Reduce scrape volume or raise retentionSize and
              the PVC if the full window is needed.

        - alert: PrometheusStorageCritical
          expr: >
            max by (namespace, persistentvolumeclaim) (
              kubelet_volume_stats_used_bytes{namespace="monitoring",persistentvolumeclaim=~"prometheus-.*-db-.*"}
              /
              kubelet_volume_stats_capacity_bytes{namespace="monitoring",persistentvolumeclaim=~"prometheus-.*-db-.*"}
            ) > 0.97
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus data volume {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
            description: >
              The Prometheus data PVC is nearly full, so the TSDB retentionSize
              cap no longer protects this volume. Raise the PVC or lower
              retentionSize.
