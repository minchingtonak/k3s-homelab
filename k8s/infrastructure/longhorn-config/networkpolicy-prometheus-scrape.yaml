---
# The longhorn chart's own `longhorn-manager` NetworkPolicy only admits
# ingress from longhorn components, so Prometheus (monitoring ns) cannot
# scrape the manager's :9500 metrics endpoint that the
# longhorn-prometheus-servicemonitor points at. NetworkPolicies are
# additive-allow: this policy unions the manager's ingress with the
# exact scrape source instead of editing the chart-managed policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-longhorn-manager
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: metrics
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9500
          protocol: TCP
