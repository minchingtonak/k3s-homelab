apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  target:
    service: kube-prometheus-stack-grafana
    port: 80
  rules:
    - hosts:
        - grafana.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kube-prometheus-stack-grafana
  namespace: monitoring
spec:
  scaleTargetRef:
    name: kube-prometheus-stack-grafana
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: grafana
