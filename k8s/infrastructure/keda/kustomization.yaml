apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease-keda.yaml
  - helmrelease-keda-add-ons-http.yaml
  - mutatingadmissionpolicy.yaml
configMapGenerator:
