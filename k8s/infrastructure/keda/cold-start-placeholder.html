<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Reload until the real app answers; the KEDA interceptor swaps this
         page in only while the backend scales up from zero. -->
    <meta http-equiv="refresh" content="5" />
    <title>Warming up&hellip;</title>
    <style>
      /* Tweak these to taste. */
      :root {
        color-scheme: light dark;
        --text-opacity: 0.08; /* opacity of the tiled background text */
        --text-size: 2.25rem;
        --scroll-speed: 45s; /* time to drift one tile width */
      }

      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: Canvas;
        color: CanvasText;
        overflow: hidden;
      }

      /* --- Tiled LOADING... background ------------------------------- */
      .bg {
        position: fixed;
        /* Oversized so the 45deg rotation never exposes a corner. */
        inset: -50vmax;
        z-index: -1;
        overflow: hidden;
        opacity: var(--text-opacity);
        pointer-events: none;
        user-select: none;
      }
      .bg-track {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transform: rotate(45deg);
        /* Drift one text-unit toward the bottom-right, forever. The
           distance is measured in script so the loop is seamless. */
        animation: drift var(--scroll-speed) linear infinite;
      }
      .bg-row {
        white-space: pre;
        font-size: var(--text-size);
        font-weight: 700;
        letter-spacing: 0.12em;
        line-height: 1.9;
      }
      /* Hidden measurer: width of one "LOADING... " unit. */
      .bg-unit {
        position: absolute;
        visibility: hidden;
        white-space: pre;
        font-size: var(--text-size);
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      @keyframes drift {
        from {
          transform: rotate(45deg) translateX(0);
        }
        to {
          transform: rotate(45deg) translateX(var(--scroll-period, 220px));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bg-track {
          animation: none;
        }
      }

      /* --- Foreground card ------------------------------------------ */
      main {
        text-align: center;
        padding: 2rem;
      }
      .dot {
        width: 2.5rem;
        height: 2.5rem;
        margin: 0 auto 1.25rem;
        border: 3px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        opacity: 0.6;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 0.4rem;
      }
      p {
        margin: 0;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-track"></div>
      <span class="bg-unit">LOADING... </span>
    </div>
    <main>
      <div class="dot"></div>
      <h1 id="app">This app is waking up</h1>
      <p>This page reloads itself every few seconds until the app is ready.</p>
    </main>
    <script>
      document.querySelector("#app").textContent =
        location.host + " is waking up";

      // Fill the background with staggered rows of text and set the
      // drift period to one unit width so the scroll loops seamlessly.
      const unitW =
        document.querySelector(".bg-unit").getBoundingClientRect().width;
      document.documentElement.style.setProperty(
        "--scroll-period",
        `${unitW}px`,
      );
      const track = document.querySelector(".bg-track");
      const makeRow = (i) => {
        const row = document.createElement("div");
        row.className = "bg-row";
        row.textContent = "LOADING • PLEASE WAIT • ".repeat(
          Math.ceil(track.clientWidth / unitW) + 2,
        );
        // Stagger alternate rows by half a unit for the tiled look.
        row.style.marginLeft = `${(i % 2) * (unitW / 2)}px`;
        return row;
      };
      track.append(makeRow(0));

      const rowH = track.firstElementChild.offsetHeight;
      const rows = Math.ceil(track.clientHeight / rowH) + 4;
      for (let i = 1; i < rows; i++) {
        track.append(makeRow(i));
      }

      // Sync animations to wall-clock time so the 5s auto-refresh is seamless
      const sync = (el) => {
        const periodMs =
          parseFloat(getComputedStyle(el).animationDuration) * 1000;
        if (periodMs > 0) {
          el.style.animationDelay = `${-(Date.now() % periodMs)}ms`;
        }
      };
      sync(track);
      sync(document.querySelector(".dot"));
    </script>
  </body>
</html>
