apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 1h
  values:
    global:
      timezone: America/New_York
    defaultBackupStore:
      backupTarget: s3://minicluster-longhorn-backups@us-west-004/
      backupTargetCredentialSecret: aws-secret
      # how often Longhorn syncs backup volume state.
      pollInterval: 300
    defaultSettings:
      # Matches the dedicated data disk provisioned by the ansible common role
      defaultDataPath: /mnt/data/longhorn
      defaultReplicaCount: 2
      # Allow a volume's replicas to schedule onto the same node
      replicaSoftAntiAffinity: false
      snapshotDataIntegrity: enabled
      # skip hashing right after snapshot creation to reduce perf impact
      snapshotDataIntegrityImmediateCheckAfterSnapshotCreation: false
      # Saturday 3am
      snapshotDataIntegrityCronjob: "0 3 * * 6"
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
    csi:
      attacherReplicaCount: 3
      provisionerReplicaCount: 3
      resizerReplicaCount: 3
      snapshotterReplicaCount: 3
      podAntiAffinityPreset: soft
    longhornUI:
      replicas: 2
    ingress:
      enabled: false
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
