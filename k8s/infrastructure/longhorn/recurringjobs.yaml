# Volumes with no recurring-job label are auto-enrolled in `default` by
# Longhorn, so every volume gets the four jobs below unless it is explicitly
# assigned elsewhere.
#
# Every cron here is in America/New_York. Longhorn renders each job as
# a Kubernetes CronJob and none of them set .spec.timeZone, so they inherit the
# kube-controller-manager's local zone — which on k3s is the server node's, and
# that node is on Eastern.
#
# The `cold` group is for volumes of scale-to-zero (KEDA) apps. They are
# detached most of the time, and a recurring-job run against a detached volume
# (allow-recurring-job-while-volume-detached) briefly attaches it and emits
# transient warning events for every snapshot create/prune while the engine is
# stopped. `cold` therefore opts out of `snapshot-hourly` — a snapshot of a
# frozen volume is a zero-delta duplicate — while the backup jobs below still
# cover it.
#
# Group membership lives on the Longhorn volume as `recurring-job-group.*`
# labels. The declarative source of truth is the app's PVC manifest: when a
# PVC carries `recurring-job.longhorn.io/source: enabled`, Longhorn mirrors
# its recurring-job labels onto the volume and enforces that exact set (so
# ad-hoc `kubectl label volume` changes get reverted — edit the PVC instead).
# Without the source label Longhorn ignores PVC labels entirely:
#   labels:
#     recurring-job.longhorn.io/source: "enabled"
#     recurring-job-group.longhorn.io/cold: "enabled"
#     recurring-job-group.longhorn.io/default: "disabled"
# Claims also pin `default: "disabled"`: some carry a stale
# `default: enabled` from provisioning (before this repo grew the `cold`
# group) which the mirror would copy back onto the volume, and pinning it
# everywhere keeps Flux owning the field so it cannot drift. See the app
# manifests and the grafana postRenderers patch.
# The cold PVCs owned by manifests in k8s/apps already carry these;
# kube-prometheus-stack-grafana is chart-managed and gets them via a
# postRenderers patch in the kube-prometheus-stack HelmRelease. The kubectl
# route is the fallback for a claim with no manifest at all:
#   kubectl -n longhorn-system label volumes.longhorn.io <vol-name> \
#     recurring-job-group.longhorn.io/cold=enabled \
#     recurring-job-group.longhorn.io/default-
# To return a volume to hourly snapshots, swap both labels (and its PVC).
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  cron: "0 6 * * *" # 06:00
  task: backup
  groups:
    - default
    - cold
  retain: 14
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly
  namespace: longhorn-system
spec:
  # stagger from daily job to avoid s3 lock-contention failures
  cron: "0 9 * * 0" # 09:00 Sunday
  task: backup
  groups:
    - default
    - cold
  retain: 8
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-monthly
  namespace: longhorn-system
spec:
  # stagger from daily, weekly jobs to avoid s3 lock-contention failures
  cron: "0 11 1 * *" # 11:00 on the 1st
  task: backup
  groups:
    - default
    - cold
  retain: 12
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-hourly
  namespace: longhorn-system
spec:
  cron: "0 * * * *"
  task: snapshot
  groups:
    - default # `cold` volumes are deliberately excluded (see above)
  retain: 24
  concurrency: 3
---
# A volume joins this group at provisioning time via the longhorn-metrics
# StorageClass (storageclass-metrics.yaml), which is the declarative route.
#
# Volumes that already existed when this group was added had to be labelled by
# hand instead, because the selector is only read at creation:
#   kubectl -n longhorn-system label volume <pvc-name> \
#     recurring-job-group.longhorn.io/metrics=enabled
#   kubectl -n longhorn-system label volume <pvc-name> \
#     recurring-job-group.longhorn.io/default-
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-metrics
  namespace: longhorn-system
spec:
  cron: "0 */12 * * *" # 00:00 and 12:00
  task: snapshot
  groups:
    - metrics
  retain: 2
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-metrics
  namespace: longhorn-system
spec:
  cron: "0 3 * * 0" # 03:00 Sunday
  task: backup
  groups:
    - metrics
  retain: 4
  concurrency: 1
