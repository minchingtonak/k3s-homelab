# Read-only cluster access for the Hermes agent — everything except Secrets.
#
# This cannot be written as a single `apiGroups: ["*"] resources: ["*"]` rule.
# RBAC has no deny, and "*" matches the core group too, so any wildcard that
# covers CRDs also re-grants Secrets. Excluding one resource therefore means
# enumerating the core group by hand (rule 1) and wildcarding everything else
# (rule 2).
#
# Secrets are withheld on purpose: flux-system/sops-age holds the age private
# key for every *.sops.yaml in this repo. Granting Secret reads would hand the
# agent the SOPS master key and make its own scoped age key pointless.
# The agent reaches secret material through the repo instead, where access is
# governed by .sops.yaml and every change is visible in git history.
#
# Adding a new CRD group? Append it to rule 2. If the agent reports "forbidden"
# on some new custom resource, that is the reason.
#
# authentication.k8s.io and authorization.k8s.io are absent on purpose, not by
# oversight: they hold only create-only review APIs (TokenReview,
# SubjectAccessReview) with nothing gettable, and `kubectl auth can-i` already
# works for any authenticated identity via the built-in system:basic-user role.
#
# No verb other than get/list/watch appears in this file. Flux is the only
# writer; the agent proposes changes as pull requests.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-readonly
rules:
  # Rule 1 — core ("") group, enumerated so that Secrets can be left out.
  # Subresources must be listed explicitly; a bare "pods" does not imply
  # "pods/log".
  - apiGroups: [""]
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/status
      - nodes
      - nodes/status
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - pods/status
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
      - services/status
    verbs: ["get", "list", "watch"]

  # Rule 2 — every other API group: built-in extensions, Flux, and every CRD
  # installed in this cluster.
  - apiGroups:
      - acme.cert-manager.io
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - autoscaling
      - batch
      - cert-manager.io
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - externaldns.k8s.io
      - flowcontrol.apiserver.k8s.io
      - fluxcd.controlplane.io
      - helm.cattle.io
      - helm.toolkit.fluxcd.io
      - hub.traefik.io
      - image.toolkit.fluxcd.io
      - k3s.cattle.io
      - kustomize.toolkit.fluxcd.io
      - lego.dns-solver
      - longhorn.io
      - metallb.io
      - metrics.k8s.io
      - monitoring.coreos.com
      - monitoring.grafana.com
      - networking.k8s.io
      - node.k8s.io
      - notification.toolkit.fluxcd.io
      - policy
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - source.toolkit.fluxcd.io
      - storage.k8s.io
      - traefik.io
      - upgrade.cattle.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-readonly
subjects:
  - kind: ServiceAccount
    name: hermes-readonly
    namespace: hermes
