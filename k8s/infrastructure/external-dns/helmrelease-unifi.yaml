# Second external-dns instance that writes item.fyi records into the UniFi
# controller's built-in DNS, giving split-horizon resolution on the LAN
#
# UniFi's DNS backend rejects wildcard hostnames, so this instance cannot mirror
# the `*.item.fyi` record the Porkbun instance publishes. It uses the
# `traefik-proxy` source instead, emitting one A record per IngressRoute host.
# The target annotation those routes need is injected cluster-wide by
# mutatingadmissionpolicy.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-unifi
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.21.1" # https://github.com/kubernetes-sigs/external-dns/releases
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: external-dns-unifi
    extraArgs:
      - --webhook-provider-url=http://127.0.0.1:8888
    sources:
      - traefik-proxy
    domainFilters:
      - item.fyi
    policy: sync
    registry: txt
    # Distinct from the Porkbun instance so the two registries can never claim
    # each other's records if they ever share a backend.
    txtOwnerId: unifi
    txtPrefix: k8s.%{record_type}-
    triggerLoopOnEvent: true
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.10.12@sha256:5338b99662e2e15048b4e14b49e17279d384970fdcb3c29169f509f806f49cbe # https://github.com/home-operations/external-dns-unifi-webhook/releases
        env:
          - name: UNIFI_HOST
            value: https://192.168.20.1
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: unifi-api-credentials
                key: UNIFI_API_KEY
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          successThreshold: 1
