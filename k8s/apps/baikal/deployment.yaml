apiVersion: v1
kind: Namespace
metadata:
  name: baikal
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baikal-config
  namespace: baikal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baikal-data
  namespace: baikal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baikal
  namespace: baikal
  labels:
    app.kubernetes.io/name: baikal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: baikal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baikal
        newt.homelab/allow: "true"
    spec:
      containers:
        - name: baikal
          image: ghcr.io/aalmenar/baikal:0.13.0-nginx@sha256:329ade88f83e2017e37715b4f649f51ddee0c0425d6940b8c2542ce04a0873dd
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /var/www/baikal/config
            - name: data
              mountPath: /var/www/baikal/Specific
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: baikal-config
        - name: data
          persistentVolumeClaim:
            claimName: baikal-data
---
apiVersion: v1
kind: Service
metadata:
  name: baikal
  namespace: baikal
  annotations:
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
spec:
  selector:
    app.kubernetes.io/name: baikal
  ports:
    - port: 80
      targetPort: 80
      name: http
