---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: servarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: servarr
  labels:
    app.kubernetes.io/name: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      securityContext:
        fsGroup: 100000
      containers:
        - name: radarr
          image: ghcr.io/linuxserver/radarr:7.0.3@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
          env:
            - name: PUID
              value: "100000"
            - name: PGID
              value: "100000"
            - name: TZ
              value: America/New_York
            - name: RADARR__AUTH__METHOD
              value: Oidc
            - name: RADARR__AUTH__REQUIRED
              value: Enabled
            - name: RADARR__AUTH__OIDCAUTHORITY
              value: https://auth.item.fyi/application/o/radarr/
            - name: RADARR__AUTH__OIDCCLIENTID
              value: radarr
            - name: RADARR__AUTH__OIDCCLIENTSECRET
              value: ${SECRET_RADARR_OIDC_CLIENT_SECRET}
            - name: RADARR__AUTH__OIDCUSERIDENTIFIER
              value: ${SECRET_RADARR_OIDC_USER}
            - name: RADARR__AUTH__OIDCSCOPES
              value: openid profile email
          ports:
            - name: http
              containerPort: 7878
          livenessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 4
            timeoutSeconds: 4
          readinessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /data/movies
            - name: downloads
              mountPath: /data/downloads
            # Custom script for the Radarr/Sonarr "preserve-added-date"
            # connection; defaultMode makes it executable in-container.
            - name: preserve-added-date-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: movies
          persistentVolumeClaim:
            claimName: servarr-movies
        - name: downloads
          persistentVolumeClaim:
            claimName: servarr-downloads
        - name: preserve-added-date-script
          configMap:
            name: preserve-added-date-script
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: servarr
  annotations:
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
spec:
  selector:
    app.kubernetes.io/name: radarr
  ports:
    - port: 7878
      targetPort: 7878
      name: http
