apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Namespaces generated resources (configMapGenerator output has no
# metadata.namespace of its own); handwritten manifests already carry this
# same namespace, so this is a no-op for them.
namespace: servarr
resources:
  - namespace.yaml
  - storage.yaml
  - secrets.yaml
  - gluetun-wireguard-secret.sops.yaml
  - downloaders.yaml
  - prowlarr.yaml
  - sonarr.yaml
  - radarr.yaml
  - lidarr.yaml
  - triggarr.yaml
  - listenarr.yaml
  - bazarr.yaml
  - subsyncarr.yaml
  - profilarr.yaml
  - cleanuparr.yaml
  - qbit-unlinked-cleanup.yaml
  - qbit-unlinked-cleanup-secret.sops.yaml
  - apprise-service.yaml
  - ingressroutes.yaml
configMapGenerator:
  - name: qbit-unlinked-cleanup-script
    files:
      - cleanup.py=scripts/qbit-unlinked-cleanup.py
# Generated ConfigMaps must not be touched by Flux postBuild substitution
# (the servarr Kustomization substitutes ${VAR} placeholders) - the Python
# scripts are verbatim file content. Handwritten ConfigMaps like
# slskd-config keep their ${SECRET_*} substitution; this only affects
# generated ones (dagu pattern). The hash suffix is disabled because
# kustomize does not rewrite CronJob jobTemplate volume references to
# hashed names (it does for Deployments), and a CronJob mounts fresh
# content on every run anyway.
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
