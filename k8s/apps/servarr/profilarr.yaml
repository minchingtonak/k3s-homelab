---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: profilarr-config
  namespace: servarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profilarr
  namespace: servarr
  labels:
    app.kubernetes.io/name: profilarr
  annotations:
    secret.reloader.stakater.com/reload: profilarr-oidc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: profilarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profilarr
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 100000
      containers:
        - name: profilarr
          image: ghcr.io/dictionarry-hub/profilarr:2.3.1@sha256:352e42dec74ecfd68d13bb198fbc6d9346e3a8c55003026e1814e59319a2176d
          env:
            - name: TZ
              value: America/New_York
            - name: AUTH
              value: "on"
            - name: OIDC_CLIENT_ID
              value: profilarr
            - name: OIDC_DISCOVERY_URL
              value: https://auth.item.fyi/application/o/profilarr/.well-known/openid-configuration
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: profilarr-oidc
                  key: OIDC_CLIENT_SECRET
            - name: ORIGIN
              value: https://profilarr.item.fyi
          ports:
            - name: http
              containerPort: 6868
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: profilarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: profilarr
  namespace: servarr
  annotations:
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
spec:
  selector:
    app.kubernetes.io/name: profilarr
  ports:
    - port: 6868
      targetPort: 6868
      name: http
