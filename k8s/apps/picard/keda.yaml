apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: picard
  namespace: picard
spec:
  target:
    service: picard
    port: 5800
  rules:
    - hosts:
        - picard.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: picard
  namespace: picard
spec:
  scaleTargetRef:
    name: picard
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: picard
