---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
        newt.homelab/allow: "true"
    spec:
      securityContext:
        fsGroup: 100000
        # video + render groups on the minicluster nodes — grants access to the
        # bind-mounted /dev/dri (renderD128) for AMD VAAPI hardware transcoding.
        supplementalGroups:
          - 44
          - 992
      containers:
        - name: jellyfin
          image: ghcr.io/jellyfin/jellyfin:12.1@sha256:008ec8024bdaaa6f0a3f0de468e185633eeba9d67c56936e8dbf5ef6b8d6200f
          securityContext:
            # hostPath /dev/dri exposes the device nodes but k8s blocks major 226 in the
            # device cgroup; privileged bypasses it so VAAPI can open renderD128.
            privileged: true
            runAsUser: 100000
            runAsGroup: 100000
          env:
            - name: JELLYFIN_CONFIG_DIR
              value: /config
            - name: JELLYFIN_DATA_DIR
              value: /config/data
            - name: JELLYFIN_LOG_DIR
              value: /config/log
            - name: JELLYFIN_CACHE_DIR
              value: /cache
            - name: TZ
              value: America/New_York
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.item.fyi
          ports:
            - name: http
              containerPort: 8096
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /mnt/media
            - name: dev-dri
              mountPath: /dev/dri
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
  annotations:
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
      name: http
