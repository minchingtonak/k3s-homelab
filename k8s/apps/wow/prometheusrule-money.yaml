# Lifetime money earned, reconstructed from balance rises.
#
# Nothing in the database records earnings — characters.money is a balance, so
# gains are only observable as rises between consecutive scrapes. The dashboard
# used to compute sum-over-window at query time, which measures "earned in the
# last N days": old gains leave the trailing window and the line dips, which
# reads as a bug. These rules make the accumulation incremental instead, so the
# recorded series is monotonic and the panel is a plain gauge read.
#
#   delta    — rise in the balance over the last 30s, clamped at zero. Matches
#              the scrape interval; money gained and spent between two
#              consecutive scrapes cancels and stays invisible.
#   earned   — previous earned total plus the current delta. The `or` fallback
#              bootstraps the first evaluation (and any later one where the
#              previous sample is out of the 5m lookback) from zero.
#
# Failure mode: if Prometheus stops evaluating this group for more than the
# lookback window (rule gap, downtime), `offset 30s` finds nothing and the
# total restarts from zero at the resumption point. Pre-gap earnings are not
# recoverable from the balance. Baseline starts when this rule is first
# deployed; earnings before that were never observable.
#
# Evaluated by both Prometheuses: the main instance (match-all rule selector)
# and wow-longterm (matching wow.longterm/rules). They run the same expr at the
# same 30s cadence against their own copies of the raw series, so each records
# an independent earned total with no shared state.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wow-money
  namespace: wow
  labels:
    wow.longterm/rules: "true"
spec:
  groups:
    - name: wow.money
      interval: 30s
      rules:
        - record: wow_character_money_delta_copper
          expr: |
            clamp_min(
              max by (character_name) (wow_character_money_copper)
              - max by (character_name) (wow_character_money_copper offset 30s),
              0
            )
        - record: wow_character_money_earned_copper
          expr: |
            wow_character_money_delta_copper
            + (wow_character_money_earned_copper offset 30s or wow_character_money_delta_copper * 0)
