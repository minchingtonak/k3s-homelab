# Lifetime money earned, reconstructed from balance rises: the database
# records no earnings, only the current purse, so gains are observable
# solely as rises between scrapes. Accumulated incrementally here so the
# recorded series is monotonic and the panel is a plain gauge read.
#
#   delta  — rise in the balance over the last 30s, clamped at zero
#            (money gained and spent between scrapes cancels out).
#   earned — previous total plus the current delta; the `or` fallback
#            bootstraps a first evaluation from zero.
#
# Every read-back goes through a subquery because a single failed scrape
# writes staleness markers that terminate the plain-selector lookback —
# under the previous `offset 30s` design one 30-second blip (2026-09-06)
# zeroed every character's tally on both instances. Subquery evaluation
# leaves holes instead of markers, so last_over_time bridges them. The 1h
# windows survive any gap up to an hour and still book money earned
# during it; a longer gap restarts the total from zero (pre-gap earnings
# are unrecoverable) — the alert below detects that.
#
# Evaluated by both Prometheuses (main and wow-longterm, via
# wow.longterm/rules), each keeping an independent total; only the main
# instance is wired to Alertmanager.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wow-money
  namespace: wow
  labels:
    wow.longterm/rules: "true"
spec:
  groups:
    - name: wow.money
      interval: 30s
      rules:
        # Both sides through subqueries: a blip yields delta=0 instead of
        # a vanished series; an outage up to 1h yields one delta spanning
        # the gap.
        - record: wow_character_money_delta_copper
          expr: |
            clamp_min(
              max by (character_name) (
                last_over_time(
                  wow_character_money_copper[1h:30s]
                )
              )
              - max by (character_name) (
                last_over_time(
                  wow_character_money_copper[1h:30s] offset 30s
                )
              ),
              0
            )
        # The tally reads itself the same way, bridging any markers it
        # wrote while the delta side was empty. `or` fires only on a
        # first evaluation.
        - record: wow_character_money_earned_copper
          expr: |
            wow_character_money_delta_copper
            + (
                last_over_time(
                  wow_character_money_earned_copper[1h:30s]
                )
                or wow_character_money_delta_copper * 0
              )
        # Monotonic by construction, so any fall is a wipe: a gap over
        # the 1h window, or the series recreated from scratch. No `for`:
        # the loss is permanent when it fires.
        - alert: WowMoneyEarnedTotalReset
          expr: |
            resets(wow_character_money_earned_copper[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "WoW money tally reset ({{ $labels.character_name }})"
            description: >
              The money-earned tally for {{ $labels.character_name }}
              dropped. It is monotonic by construction, so the rule
              group's evaluation history had a gap longer than its 1h
              recovery window (Prometheus, database or exporter downtime)
              and the total restarted from zero. Pre-gap earnings are not
              recoverable — check what was down around the reset time.
