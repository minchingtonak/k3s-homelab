# Picked up by the kube-prometheus-stack Grafana dashboard sidecar, which
# watches every namespace for ConfigMaps labelled grafana_dashboard=1 — so
# this can live beside the realm rather than in the monitoring namespace.
#
# Panels mirror `scripts/wow-accounts.py stats` and `online` so the dashboard
# and the CLI report the same things.
#
# Every query is wrapped in max() / max by (...). A bare metric name resolves
# to one series per exporter pod that has run inside the retention window, so
# each restart adds a duplicate line to every graph and a duplicate row to
# every table. max collapses them to the single replica's value; sum would
# double-count during a rollout when two pods briefly overlap.
#
# The player map stacks four "label halo" marker layers under the real one.
# Grafana builds the label as an OpenLayers Text with a fill and no stroke and
# offers no outline option, so the only way to keep names readable over both
# snow and ocean is to draw them four times in black at +/-1px and let the
# pink copy land on top. A markers layer with no `symbol` renders text only
# (getMarkerMaker returns textMarker when the symbol is unset and a text field
# is bound), which is what makes the halo layers dotless. They set
# tooltip: false so clicks still land on the real layer.
#
# Bar charts and the table read Prometheus *table*-format instant queries and
# set options.xField (or an organize transform) to the label column. Without
# that, Grafana picks the first string field it finds — which is the metric
# name, so every bar collapses into one row. Class and race arrive already
# resolved to names from the exporter's CASE expressions, so no Grafana value
# mappings are involved; when they were, they applied to the count axis and
# rendered "Warrior" as an x-axis tick between 0.8 and 1.2.
apiVersion: v1
kind: ConfigMap
