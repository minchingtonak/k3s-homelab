# Picked up by the kube-prometheus-stack Grafana dashboard sidecar, which
# watches every namespace for ConfigMaps labelled grafana_dashboard=1 — so
# this can live beside the realm rather than in the monitoring namespace.
#
# Class and race ids are mapped to names by Grafana value mappings rather
# than in SQL: the names come from the client's DBC files and are not in the
# database, so the exporter can only emit the raw ids.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wow-grafana-dashboard
  namespace: wow
  labels:
    grafana_dashboard: "1"
data:
  wow-realm.json: |
    {
      "uid": "wow-realm",
      "title": "WoW realm \u2014 Stalley of Vardew",
      "tags": [
        "wow",
        "azerothcore"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Players online",
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "wow_players_online",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
