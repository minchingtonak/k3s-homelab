# Picked up by the kube-prometheus-stack Grafana dashboard sidecar, which
# watches every namespace for ConfigMaps labelled grafana_dashboard=1 — so
# this can live beside the realm rather than in the monitoring namespace.
#
# The bar charts read a Prometheus *table*-format instant query and set
# options.xField to the label column. Without xField, Grafana picks the
# first string field it finds — which is the metric name, so every bar ends
# up in one row labelled wow_characters_by_class. Class and race arrive from
# the exporter already resolved to names (see the CASE expressions in
# sql-exporter.yaml), so no Grafana value mappings are involved; when they
# were, they applied to the count axis instead and rendered "Warrior" as an
# x-axis tick between 0.8 and 1.2.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wow-grafana-dashboard
  namespace: wow
  labels:
    grafana_dashboard: "1"
data:
  wow-realm.json: |
    {
      "uid": "wow-realm",
      "title": "WoW realm \u2014 Stalley of Vardew",
      "tags": [
        "wow",
        "azerothcore"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Players online",
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "wow_players_online",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Accounts online",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
