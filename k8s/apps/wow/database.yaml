apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wow-database-data
  namespace: wow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wow-database
  namespace: wow
  labels:
    app.kubernetes.io/name: wow-database
  annotations:
    secret.reloader.stakater.com/reload: wow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wow-database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wow-database
    spec:
      # official mysql image runs as uid 999; let kubelet group-own the volume
      securityContext:
        fsGroup: 999
      containers:
        - name: mysql
          # same image the upstream azerothcore docker-compose uses
          image: docker.io/library/mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wow-database-data
---
apiVersion: v1
kind: Service
metadata:
  name: wow-database
  namespace: wow
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wow-database
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
