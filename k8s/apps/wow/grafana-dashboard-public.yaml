# A second, deliberately reduced dashboard for players rather than operators.
#
# Two constraints shape it. Grafana's externally shared dashboards do not
# interpolate template variables, so every query and the map's tile URL is a
# literal — the continent picker and the copper/silver/gold switcher cannot come
# along. And nothing here may reveal accounts: no usernames, GM levels, last
# logins, IPs or per-account latency. Account labels are aggregated away in the
# queries themselves rather than hidden by an organize transform, because a
# transform only drops a column from the view, not from the query result the
# browser receives.
#
# Derived from wow-realm's panels rather than written by hand, so the two can be
# kept in step. Anything added must clear the same two bars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wow-grafana-dashboard-public
  namespace: wow
  labels:
    grafana_dashboard: "1"
