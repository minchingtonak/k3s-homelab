apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wow-worldserver-data
  namespace: wow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wow-worldserver
  namespace: wow
  labels:
    app.kubernetes.io/name: wow-worldserver
  annotations:
    secret.reloader.stakater.com/reload: wow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wow-worldserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wow-worldserver
    spec:
      # acore images run as uid 1000; the volume subpaths (data/etc/logs) must
      # be writable by that user on the freshly-provisioned Longhorn volume
      securityContext:
        fsGroup: 1000
      # first boot runs four init containers and can take 15+ minutes:
      #   1. client-data  - downloads pre-extracted maps/vmaps/mmaps (~2.7GB)
      #   2. wait-for-db  - blocks until mysql answers ping
      #   3. db-import    - creates schemas and applies migrations (idempotent)
      #   4. realmlist    - points the realm at the worldserver load balancer IP
      # subsequent boots skip the download and the migrations are no-ops.
      initContainers:
        - name: client-data
          # same image & behaviour as the upstream ac-client-data container
          image: acore/ac-wotlk-client-data:master@sha256:4b64c47f4f4499c6e584187f06b6731ba6aeeb5cf2547221e32f5e1fb2316916
          env:
            - name: DATAPATH
              value: /azerothcore/env/dist/data
          volumeMounts:
            - name: data
              mountPath: /azerothcore/env/dist/data
              subPath: data
        - name: wait-for-db
          image: docker.io/library/mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: MYSQL_ROOT_PASSWORD
          command:
            - sh
            - -c
            - >
              until mysqladmin ping -h wow-database.wow.svc.cluster.local -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
              echo waiting for mysql; sleep 5; done
        - name: db-import
          # same image & behaviour as the upstream ac-db-import container
          image: acore/ac-wotlk-db-import:master@sha256:97523baa99ee5bfeb8d173b5057011807804c320b5a78702924ed202359a3234
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: MYSQL_ROOT_PASSWORD
            - name: AC_LOGIN_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_auth
            - name: AC_WORLD_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_world
            - name: AC_CHARACTER_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_characters
          volumeMounts:
            - name: data
              mountPath: /azerothcore/env/dist/etc
              subPath: etc
            - name: data
              mountPath: /azerothcore/env/dist/logs
              subPath: logs
        - name: realmlist
          image: docker.io/library/mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: MYSQL_ROOT_PASSWORD
          command:
            - sh
            - -c
            - >
              until mysql -h wow-database.wow.svc.cluster.local -uroot -p"$MYSQL_ROOT_PASSWORD"
              -e "SELECT 1 FROM acore_auth.realmlist LIMIT 1" 2>/dev/null; do
              echo waiting for schema; sleep 5; done &&
              mysql -h wow-database.wow.svc.cluster.local -uroot -p"$MYSQL_ROOT_PASSWORD"
              -e "UPDATE acore_auth.realmlist SET address='192.168.20.93', name='Minicluster' WHERE id=1"
      containers:
        - name: worldserver
          image: acore/ac-wotlk-worldserver:master@sha256:eb9ce9b8c9b0d9f37670cc75c30f608dc7ccd9613dd17ac8536d2ad911516f1e
          stdin: true
          tty: true
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: MYSQL_ROOT_PASSWORD
            - name: AC_LOGIN_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_auth
            - name: AC_WORLD_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_world
            - name: AC_CHARACTER_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_characters
            # keep the interactive CLI thread alive so `kubectl attach` works as
            # the admin console (account create etc). the image ships
            # AC_DISABLE_INTERACTIVE=1 which may disable the CLI thread; SOAP
            # below is the second, always-available admin path.
            - name: AC_DISABLE_INTERACTIVE
              value: "0"
            # admin console over SOAP instead of stdin attach
            - name: AC_SOAP_ENABLED
              value: "1"
            - name: AC_SOAP_IP
              value: 0.0.0.0
          ports:
            - name: world
              containerPort: 8085
              protocol: TCP
            - name: soap
              containerPort: 7878
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /azerothcore/env/dist/data
              subPath: data
              readOnly: true
            - name: data
              mountPath: /azerothcore/env/dist/etc
              subPath: etc
            - name: data
              mountPath: /azerothcore/env/dist/logs
              subPath: logs
          resources:
            requests:
              memory: 4096Mi
              cpu: "1"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wow-worldserver-data
---
apiVersion: v1
kind: Service
metadata:
  name: wow-worldserver
  namespace: wow
  annotations:
    metallb.io/loadBalancerIPs: 192.168.20.93
    gatus.home-operations.com/enabled: "false"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: wow-worldserver
  ports:
    - name: world
      port: 8085
      targetPort: 8085
      protocol: TCP
