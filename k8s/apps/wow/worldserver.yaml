apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wow-worldserver-data
  namespace: wow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wow-worldserver
  namespace: wow
  labels:
    app.kubernetes.io/name: wow-worldserver
  annotations:
    secret.reloader.stakater.com/reload: wow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wow-worldserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wow-worldserver
        newt.homelab/allow: "true"
    spec:
      # acore images run as uid 1000; the volume subpaths (data/etc/logs) must
      # be writable by that user on the freshly-provisioned Longhorn volume
      securityContext:
        fsGroup: 1000
      # keep the heavy workload on the node with the most real memory headroom
      # (30d prometheus peaks: agent-01 ~10.4Gi, agent-02 ~11.4Gi, server-01
      # ~13.7Gi of ~15Gi each). preferred rather than required so the pod still
      # schedules elsewhere if agent-01 is down or full at deploy time.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - minicluster-agent-01
      # first boot runs four init containers and can take 15+ minutes:
      #   1. client-data  - downloads pre-extracted maps/vmaps/mmaps (~2.7GB)
      #   2. wait-for-db  - blocks until mysql answers ping
      #   3. db-import    - creates schemas and applies migrations (idempotent)
      #   4. realmlist    - points the realm at the worldserver load balancer IP
      # subsequent boots skip the download and the migrations are no-ops.
      initContainers:
        - name: client-data
          # same image & behaviour as the upstream ac-client-data container
          image: acore/ac-wotlk-client-data:master@sha256:4b64c47f4f4499c6e584187f06b6731ba6aeeb5cf2547221e32f5e1fb2316916
          env:
            - name: DATAPATH
              value: /azerothcore/env/dist/data
          volumeMounts:
            - name: data
              mountPath: /azerothcore/env/dist/data
              subPath: data
        - name: wait-for-db
          image: docker.io/library/mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: MYSQL_ROOT_PASSWORD
          command:
            - sh
            - -c
            - >
              until mysqladmin ping -h wow-database.wow.svc.cluster.local -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
              echo waiting for mysql; sleep 5; done
        - name: db-import
          image: forgejo.item.fyi/akmin/ac-wotlk-db-import:20260830@sha256:1294810e1e82ebcee6aa895c0ea63ffc4ac1bac122377d6d87bffc3775666f73
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: MYSQL_ROOT_PASSWORD
            - name: AC_LOGIN_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_auth
            - name: AC_WORLD_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_world
            - name: AC_CHARACTER_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_characters
          volumeMounts:
            - name: data
              mountPath: /azerothcore/env/dist/etc
              subPath: etc
            - name: data
              mountPath: /azerothcore/env/dist/logs
              subPath: logs
        # the authserver hands `address` to clients outside localAddress/localSubnetMask
        # and `localAddress` to those inside it. Both are deliberately set to the same
        # hostname with a /32 mask, which sends every client through the tunnel
        - name: realmlist
          image: docker.io/library/mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: MYSQL_ROOT_PASSWORD
          command:
            - sh
            - -c
            - >
              until mysql -h wow-database.wow.svc.cluster.local -uroot -p"$MYSQL_ROOT_PASSWORD"
              -e "SELECT 1 FROM acore_auth.realmlist LIMIT 1" 2>/dev/null; do
              echo waiting for schema; sleep 5; done &&
              mysql -h wow-database.wow.svc.cluster.local -uroot -p"$MYSQL_ROOT_PASSWORD"
              -e "UPDATE acore_auth.realmlist SET address='wow.minch.zone',
              localAddress='wow.minch.zone', localSubnetMask='255.255.255.255',
              name='Stalley of Vardew', flag=0 WHERE id=1"
              && mysql -h wow-database.wow.svc.cluster.local -uroot -p"$MYSQL_ROOT_PASSWORD"
              -e "SELECT id,name,address,localAddress,localSubnetMask,port,flag,gamebuild
              FROM acore_auth.realmlist"
      containers:
        - name: worldserver
          image: forgejo.item.fyi/akmin/ac-wotlk-worldserver:20260830@sha256:f889c1a108576e0f17fbf29dd91fe0f12ce7ad85b90a2445ab64d9e63e9843ce
          # stdin without a tty: worldserver's CLI reads newline-terminated
          # commands from stdin, and `kubectl attach` refuses to attach to a
          # container with tty:true ("tty and stderr cannot both be true"), so
          # the admin console was unreachable
          stdin: true
          env:
            - name: TZ
              value: America/New_York
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: MYSQL_ROOT_PASSWORD
            - name: AC_LOGIN_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_auth
            - name: AC_WORLD_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_world
            - name: AC_CHARACTER_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_characters
            # the worldserver image WORKDIR is /azerothcore, so the config default
            # DataDir="." looks in the wrong place; point it at the volume where
            # the client-data init container extracts maps/vmaps/mmaps/dbc
            - name: AC_DATA_DIR
              value: /azerothcore/env/dist/data
            # keep the interactive CLI thread alive so `kubectl attach` works as
            # the admin console (account create etc). the image ships
            # AC_DISABLE_INTERACTIVE=1 which may disable the CLI thread; SOAP
            # below is the second, always-available admin path.
            - name: AC_DISABLE_INTERACTIVE
              value: "0"
            # admin console over SOAP instead of stdin attach
            - name: AC_SOAP_ENABLED
              value: "1"
            - name: AC_SOAP_IP
              value: 0.0.0.0
            # hardening for a realm reachable from the internet.
            # Warden ships as log-only (0); 1 kicks on a failed anti-cheat check.
            # 2 (ban) is deliberately avoided — Warden false positives would ban
            # legitimate players with no easy path back.
            - name: AC_WARDEN_CLIENT_CHECK_FAIL_ACTION
              value: "1"
            # cap concurrent players so a connection flood can't exhaust resources.
            # the limit excludes Mods/GMs/Admins, so it cannot lock an admin out.
            - name: AC_PLAYER_LIMIT
              value: "20"
            # restrict character names to basic Latin: stops homoglyph names that
            # impersonate GMs or other players.
            - name: AC_STRICT_PLAYER_NAMES
              value: "1"
            # see the note in authserver.yaml
            - name: AC_NETWORK_ENABLE_PROXY_PROTOCOL
              value: "0"
            # ---- sizing for a small realm ----
            - name: AC_MAIL_DELIVERY_DELAY
              value: "0"
            # a guild charter needs this many signatures. the stock 9 means
            # every other player on a ten-person realm has to be online and
            # sign, which blocks guilds outright until the server fills up.
            - name: AC_MIN_PETITION_SIGNS
              value: "0"
            # converting to a raid group to run autobalance-scaled raid content
            # otherwise stops ordinary quests completing
            - name: AC_QUESTS_IGNORE_RAID
              value: "1"
            # enter raid instances without a raid group. mostly matters for
            # soloing old content — a two-person party can already convert to a
            # raid — but it costs nothing here.
            - name: AC_INSTANCE_IGNORE_RAID
              value: "1"
            # let alliance and horde group and talk. a ten-player realm split
            # across two factions that cannot party is not much of a realm.
            # AllowTwoSide.Accounts is already 1 by default, so both factions
            # can live on one account. Channel/Guild/Auction/Calendar have their
            # own flags and stay at the stock 0.
            - name: AC_ALLOW_TWO_SIDE_INTERACTION_GROUP
              value: "1"
            - name: AC_ALLOW_TWO_SIDE_INTERACTION_CHAT
              value: "1"
            # stock value is 1, and the worldserver already burns ~840m of CPU
            # with an empty realm because that single map-update thread spins.
            # the nodes have 16 cores; the request below is raised to match.
            - name: AC_MAP_UPDATE_THREADS
              value: "4"
            # stock is 900000 (15 minutes): an online character's position lands
            # in the characters table only when it is saved, so the dashboard's
            # player-position map would show 15-minute-old dots.
            - name: AC_PLAYER_SAVE_INTERVAL
              value: "30000"
            # ---- module configuration ----
            # most of what follows restates the modules' own defaults. that is
            # deliberate: it puts the knobs worth knowing about in git rather
            # than only in the .conf files on the Longhorn volume, where they
            # are invisible to review. env beats file in
            # ConfigMgr::GetValueDefault, so what is written here is what runs
            # regardless of what an older image left on the volume. key names
            # come from the config option via IniKeyToEnvVarKey — see
            # docs/wow-modules.md for how the mangling works. anything not
            # listed here runs at its compiled default.
            #
            # mod-aoe-loot — all defaults.
            - name: AC_AOELOOT_ENABLE
              value: "1"
            # loot everything in range in one interaction while grouped
            - name: AC_AOELOOT_GROUP
              value: "1"
            - name: AC_AOELOOT_MESSAGE
              value: "1"
            # yards to sweep for lootable corpses. module accepts 5.0-100.0
            - name: AC_AOELOOT_RANGE
              value: "55.0"
            # mod-autobalance — defaults except the two REWARD_SCALING toggles.
            # scaling runs in both directions: a 5-man with more than five
            # players scales *up*, not just down.
            - name: AC_AUTO_BALANCE_ENABLE_GLOBAL
              value: "1"
            # floor, not target: "if fewer than this number of players enter the
            # instance, scale to the specified value". 1 means no artificial
            # floor, so content tracks whoever is actually present. raise it to
            # stop small groups trivialising an instance.
            - name: AC_AUTO_BALANCE_MIN_PLAYERS
              value: "1"
            - name: AC_AUTO_BALANCE_MIN_PLAYERS_HEROIC
              value: "1"
            - name: AC_AUTO_BALANCE_MIN_PLAYERS_RAID
              value: "1"
            - name: AC_AUTO_BALANCE_MIN_PLAYERS_RAID_HEROIC
              value: "1"
            # scale creature *levels* toward the party as well as their stats,
            # so a mixed-level group can run content together
            - name: AC_AUTO_BALANCE_LEVEL_SCALING
              value: "1"
            - name: AC_AUTO_BALANCE_LEVEL_SCALING_METHOD
              value: dynamic
            # announce rescaling in chat as players join and leave the instance
            - name: AC_AUTO_BALANCE_PLAYER_CHANGE_NOTIFY
              value: "1"
            # "dynamic" cuts rewards in proportion to how far a creature was
            # scaled down, on top of the party split the core already applies.
            # METHOD is global: it governs both XP and money, so the two are
            # steered by their individual toggles below rather than by it.
            - name: AC_AUTO_BALANCE_REWARD_SCALING_METHOD
              value: dynamic
            # XP scaling is off
            - name: AC_AUTO_BALANCE_REWARD_SCALING_XP
              value: "0"
            # inert while the toggle above is 0 — the module skips the whole XP
            # hook rather than multiplying by this. kept so the knob stays
            # visible if XP scaling is ever turned back on.
            - name: AC_AUTO_BALANCE_REWARD_SCALING_XP_MODIFIER
              value: "1.0"
            # money scaling is off too, matching XP. with both off the whole
            # "dynamic" reward path is bypassed and kills pay out as if the
            # creature had never been scaled — the core's own party split still
            # applies.
            - name: AC_AUTO_BALANCE_REWARD_SCALING_MONEY
              value: "0"
            # inert while the toggle above is 0, same as the XP modifier
            - name: AC_AUTO_BALANCE_REWARD_SCALING_MONEY_MODIFIER
              value: "1.0"
            # mod-transmog — the two below are the only non-default values in
            # this block. everything else (quality restrictions, free cost,
            # collection system, 10 sets) runs at the module's defaults.
            #
            # default 0 blocks transmogging into lower-tier gear, which rules
            # out most of the point of the module — wearing classic sets at 80.
            - name: AC_TRANSMOGRIFICATION_ALLOW_LOWER_TIERS
              value: "1"
            # default 0 requires matching armour class; 1 lets a plate wearer
            # take a cloth appearance
            - name: AC_TRANSMOGRIFICATION_ALLOW_MIXED_ARMOR_TYPES
              value: "1"
            # mod-ah-bot — compiled in but deliberately inert. Both toggles are
            # the module's own defaults (0), so nothing lists or bids until they
            # are flipped; the module still creates its tables via db-import.
            #
            # Turning it on needs two ids the database assigns, so they cannot be
            # known ahead of time:
            #   1. create a dedicated account (scripts/wow-accounts.py create ...)
            #   2. log in on it and create one character — there is no console
            #      command for character creation
            #   3. read the ids back:
            #        SELECT id FROM acore_auth.account WHERE username = '<NAME>';
            #        SELECT guid FROM acore_characters.characters WHERE account = <id>;
            #   4. set ACCOUNT and GUID below, then ENABLE_SELLER / ENABLE_BUYER
            #
            # That character owns every listing, so its name is what players see
            # as the seller. Do not play it: browsing the auction house on the bot
            # character leaves the client stuck on "Searching for items..."
            # (upstream README).
            - name: AC_AUCTION_HOUSE_BOT_ENABLE_SELLER
              value: "0"
            - name: AC_AUCTION_HOUSE_BOT_ENABLE_BUYER
              value: "0"
            - name: AC_AUCTION_HOUSE_BOT_ACCOUNT
              value: "0"
            - name: AC_AUCTION_HOUSE_BOT_GUID
              value: "0"
            # which item categories the seller may draw from. these are the
            # module's defaults: loot items and loot trade goods only.
            - name: AC_AUCTION_HOUSE_BOT_VENDOR_ITEMS
              value: "0"
            - name: AC_AUCTION_HOUSE_BOT_VENDOR_TRADE_GOODS
              value: "0"
            - name: AC_AUCTION_HOUSE_BOT_LOOT_ITEMS
              value: "1"
            - name: AC_AUCTION_HOUSE_BOT_LOOT_TRADE_GOODS
              value: "1"
            - name: AC_AUCTION_HOUSE_BOT_OTHER_ITEMS
              value: "0"
            - name: AC_AUCTION_HOUSE_BOT_OTHER_TRADE_GOODS
              value: "0"
            - name: AC_AUCTION_HOUSE_BOT_PROFESSION_ITEMS
              value: "1"
            # bind rules — which binding types are listable at all.
            # note the DOUBLE underscores.
            - name: AC_AUCTION_HOUSE_BOT_NO__BIND
              value: "1"
            - name: AC_AUCTION_HOUSE_BOT_BIND__WHEN__PICKED__UP
              value: "0"
            - name: AC_AUCTION_HOUSE_BOT_BIND__WHEN__EQUIPPED
              value: "1"
            - name: AC_AUCTION_HOUSE_BOT_BIND__WHEN__USE
              value: "1"
            - name: AC_AUCTION_HOUSE_BOT_BIND__QUEST__ITEM
              value: "0"
          ports:
            - name: world
              containerPort: 8085
              protocol: TCP
            - name: soap
              containerPort: 7878
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /azerothcore/env/dist/data
              subPath: data
              readOnly: true
            - name: data
              mountPath: /azerothcore/env/dist/etc
              subPath: etc
            - name: data
              mountPath: /azerothcore/env/dist/logs
              subPath: logs
          resources:
            requests:
              memory: 4096Mi
              cpu: "2"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wow-worldserver-data
---
apiVersion: v1
kind: Service
metadata:
  name: wow-worldserver
  namespace: wow
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  selector:
    app.kubernetes.io/name: wow-worldserver
  ports:
    - name: world
      port: 8085
      targetPort: 8085
      protocol: TCP
    - name: soap
      port: 7878
      targetPort: 7878
      protocol: TCP
