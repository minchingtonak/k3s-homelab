apiVersion: apps/v1
kind: Deployment
metadata:
  name: wow-authserver
  namespace: wow
  labels:
    app.kubernetes.io/name: wow-authserver
  annotations:
    secret.reloader.stakater.com/reload: wow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wow-authserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wow-authserver
        newt.homelab/allow: "true"
    spec:
      # the auth DB schema is created by the worldserver pod's db-import init
      # container; block here until it exists so authserver doesn't crash-loop
      # on a fresh install
      initContainers:
        - name: wait-for-auth-schema
          image: docker.io/library/mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: MYSQL_ROOT_PASSWORD
          command:
            - sh
            - -c
            - >
              until mysql -h wow-database.wow.svc.cluster.local -uroot -p"$MYSQL_ROOT_PASSWORD"
              -e "SELECT 1 FROM acore_auth.realmlist LIMIT 1" 2>/dev/null; do
              echo "waiting for acore_auth schema (worldserver db-import)"; sleep 5; done
      containers:
        - name: authserver
          image: acore/ac-wotlk-authserver:master@sha256:f34dfcfeca736b55fb2fd74602127ee03fb85f2a92e5a16fcd31e38ff0fe0125
          tty: true
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: MYSQL_ROOT_PASSWORD
            - name: AC_LOGIN_DATABASE_INFO
              value: wow-database.wow.svc.cluster.local;3306;root;$(MYSQL_ROOT_PASSWORD);acore_auth
            - name: AC_WRONG_PASS_MAX_COUNT
              value: "5"
            - name: AC_WRONG_PASS_LOGGING
              value: "1"
            # ban the account, not the IP. every client arriving over the Pangolin
            # tunnel is SNATed to newt's pod IP, so an IP ban would take the whole
            # realm offline for all external players after five bad passwords from
            # any one of them.
            - name: AC_WRONG_PASS_BAN_TYPE
              value: "1"
            # every client reaches this server through the newt tunnel, so the
            # socket's peer address is newt's pod IP for everyone. PROXY protocol
            # v2 would restore the real client address, and both sides support
            # it — but it does not work through a Pangolin *tunnelled* TCP
            # resource. Measured 2026-08-29:
            #
            #   pangolin proxy protocol ON  -> the edge accepts the client socket
            #     but never asks newt to dial the backend. no connection reaches
            #     this pod at all; newt's connection table shows no dial.
            #   pangolin proxy protocol OFF -> traffic arrives normally, and this
            #     server drops it with "received bad PROXY Protocol v2 signature
            #     for 10.42.1.44" because it is still expecting a preamble.
            #
            # So the two halves cannot both be on, and 0 is the only working
            # combination. Re-test after a Pangolin upgrade; if the edge learns to
            # forward, flip this and the worldserver's Network.EnableProxyProtocol
            # back to 1 in the same window as the Pangolin checkboxes.
            - name: AC_ENABLE_PROXY_PROTOCOL
              value: "0"
            - name: AC_TOTPMASTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: wow
                  key: TOTP_MASTER_SECRET
          ports:
            - name: auth
              containerPort: 3724
              protocol: TCP
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
---
apiVersion: v1
kind: Service
metadata:
  name: wow-authserver
  namespace: wow
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  selector:
    app.kubernetes.io/name: wow-authserver
  ports:
    - name: auth
      port: 3724
      targetPort: 3724
      protocol: TCP
