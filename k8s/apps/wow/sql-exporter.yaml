apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sql-exporter
  namespace: wow
spec:
  interval: 1h
  url: https://burningalchemist.github.io/sql_exporter/
---
# Turns the realm database into Prometheus metrics. There is no AzerothCore
# exporter — the built-in Metric.* options in worldserver.conf speak InfluxDB,
# and standing that up beside an existing Prometheus to read one number is not
# worth it. A database-agnostic SQL exporter is the smaller answer: the data
# ("how many rows have online=1") is already a trivial query.
#
# Lives in the wow namespace rather than monitoring so it sits next to the
# database it reads and the credentials it uses. Prometheus discovers it
# anyway — kube-prometheus-stack runs with serviceMonitorSelectorNilUsesHelmValues
# false, so ServiceMonitors are picked up from every namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wow-sql-exporter
  namespace: wow
spec:
  interval: 1h
  chart:
    spec:
      chart: sql-exporter
      version: "0.18.8" # https://github.com/burningalchemist/sql_exporter/releases
      sourceRef:
        kind: HelmRepository
        name: sql-exporter
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The secret is deliberately NOT named wow-sql-exporter: the chart creates a
  # Secret of that name for its own rendered config, and a collision hands Helm
  # ownership of ours as well.
  valuesFrom:
    - kind: Secret
      name: wow-sql-exporter-dsn
      valuesKey: dsn
      targetPath: config.target.data_source_name
  values:
    fullnameOverride: wow-sql-exporter
    # The DSN authenticates as `wow_exporter`, a dedicated read-only MySQL user
    # rather than root — root in a metrics pod would carry write access to the
    # whole realm for the sake of eight COUNT queries. It exists on wow-database
    # holding exactly:
    #
    #   GRANT SELECT ON acore_characters.* TO 'wow_exporter'@'%';
    #   GRANT SELECT ON acore_auth.*       TO 'wow_exporter'@'%';
    #
    # UPDATE and reads of mysql.* are both denied. A realm wipe does not drop the
    # user — that only drops the acore_* schemas. To rotate:
    #   sops k8s/apps/wow/sql-exporter-dsn.sops.yaml
    #
    # The DSN is a plain URL — mysql://user:pass@host:port/dbname
    serviceMonitor:
      enabled: true
      interval: 30s
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
    config:
      global:
        scrape_timeout: 10s
        scrape_timeout_offset: 500ms
        min_interval: 0s
        max_connections: 3
        max_idle_connections: 3
      target:
        # data_source_name is absent on purpose — valuesFrom above supplies it.
        collectors:
          - wow
      collectors:
        - collector_name: wow
          # The realm is polled, not pushed to, so there is no value in querying
          # faster than the ServiceMonitor scrapes.
          min_interval: 30s
          metrics:
            - metric_name: wow_players_online
              type: gauge
              help: "Characters currently online."
              values: [online]
              query: |
                SELECT COUNT(*) AS online FROM acore_characters.characters WHERE online = 1
            - metric_name: wow_accounts_online
              type: gauge
              help: "Accounts currently logged in."
              values: [online]
              query: |
                SELECT COUNT(*) AS online FROM acore_auth.account WHERE online = 1
            - metric_name: wow_characters_total
              type: gauge
              help: "Characters that exist on the realm."
              values: [total]
              query: |
                SELECT COUNT(*) AS total FROM acore_characters.characters
            - metric_name: wow_accounts_total
              type: gauge
              help: "Accounts that exist on the realm."
              values: [total]
              query: |
                SELECT COUNT(*) AS total FROM acore_auth.account
            # Names are resolved here rather than by Grafana value mappings.
            # They live in the client's DBC files, so either way it is a static
            # lookup — doing it in SQL keeps it in one place and makes the metric
            # self-describing, so PromQL and alerts read wow_characters_by_class
            # {class="Hunter"} instead of {class="3"}.
            - metric_name: wow_characters_by_class
              type: gauge
              help: "Characters by class."
              key_labels: [class]
              values: [total]
              query: |
                SELECT COUNT(*) AS total, CASE class
                  WHEN 1 THEN 'Warrior' WHEN 2 THEN 'Paladin' WHEN 3 THEN 'Hunter'
                  WHEN 4 THEN 'Rogue'   WHEN 5 THEN 'Priest'  WHEN 6 THEN 'Death Knight'
                  WHEN 7 THEN 'Shaman'  WHEN 8 THEN 'Mage'    WHEN 9 THEN 'Warlock'
                  WHEN 11 THEN 'Druid'  ELSE CONCAT('class-', class) END AS class
                FROM acore_characters.characters GROUP BY class
            - metric_name: wow_characters_by_race
              type: gauge
              help: "Characters by race."
              key_labels: [race]
              values: [total]
              query: |
                SELECT COUNT(*) AS total, CASE race
                  WHEN 1 THEN 'Human'  WHEN 2 THEN 'Orc'   WHEN 3 THEN 'Dwarf'
                  WHEN 4 THEN 'Night Elf' WHEN 5 THEN 'Undead' WHEN 6 THEN 'Tauren'
                  WHEN 7 THEN 'Gnome'  WHEN 8 THEN 'Troll' WHEN 10 THEN 'Blood Elf'
                  WHEN 11 THEN 'Draenei' ELSE CONCAT('race-', race) END AS race
                FROM acore_characters.characters GROUP BY race
            - metric_name: wow_character_level_max
              type: gauge
              help: "Highest character level on the realm."
              values: [level]
              query: |
                SELECT IFNULL(MAX(level), 0) AS level FROM acore_characters.characters
            - metric_name: wow_playtime_seconds_total
              type: gauge
              help: "Summed played time across all characters, in seconds."
              values: [seconds]
              query: |
                SELECT IFNULL(SUM(totaltime), 0) AS seconds FROM acore_characters.characters
            - metric_name: wow_accounts_active
              type: gauge
              help: "Accounts with a successful login inside the period."
              key_labels: [period]
              values: [total]
              query: |
                SELECT '24h' AS period, COUNT(*) AS total FROM acore_auth.account
                  WHERE last_login > NOW() - INTERVAL 1 DAY
                UNION ALL
                SELECT '7d' AS period, COUNT(*) AS total FROM acore_auth.account
                  WHERE last_login > NOW() - INTERVAL 7 DAY
            - metric_name: wow_accounts_never_logged_in
              type: gauge
              help: "Accounts created but never used — handed out and unclaimed."
              values: [total]
              query: |
                SELECT COUNT(*) AS total FROM acore_auth.account WHERE last_login IS NULL
            # Per-character series. Cardinality is one series per character, which
            # is nothing at this realm's size but would not suit a public server.
            # Carries the whole per-character row: the value is playtime, the
            # labels are everything the roster table shows. `online` flips as
            # players come and go, which mints a second series per character;
            # the idle one goes stale and Prometheus drops it.
            - metric_name: wow_character_playtime_seconds
              type: gauge
              help: "Played time per character, in seconds."
              key_labels: [character_name, account, class, race, level, online]
              values: [seconds]
              query: |
                SELECT c.name AS character_name, a.username AS account,
                  c.level AS level, c.totaltime AS seconds,
                  IF(c.online = 1, 'yes', 'no') AS online,
                  CASE c.class
                    WHEN 1 THEN 'Warrior' WHEN 2 THEN 'Paladin' WHEN 3 THEN 'Hunter'
                    WHEN 4 THEN 'Rogue'   WHEN 5 THEN 'Priest'  WHEN 6 THEN 'Death Knight'
                    WHEN 7 THEN 'Shaman'  WHEN 8 THEN 'Mage'    WHEN 9 THEN 'Warlock'
                    WHEN 11 THEN 'Druid'  ELSE CONCAT('class-', c.class) END AS class,
                  CASE c.race
                    WHEN 1 THEN 'Human'  WHEN 2 THEN 'Orc'   WHEN 3 THEN 'Dwarf'
                    WHEN 4 THEN 'Night Elf' WHEN 5 THEN 'Undead' WHEN 6 THEN 'Tauren'
                    WHEN 7 THEN 'Gnome'  WHEN 8 THEN 'Troll' WHEN 10 THEN 'Blood Elf'
                    WHEN 11 THEN 'Draenei' ELSE CONCAT('race-', c.race) END AS race
                FROM acore_characters.characters c
                JOIN acore_auth.account a ON a.id = c.account
            # Per-account pair, joined on `account` in the dashboard table. Split
            # because one Prometheus metric carries one value, and both the login
            # time and the character count are worth showing.
            #
            # Never-logged-in accounts report 0 rather than being omitted, so they
            # still appear in the roster — Grafana renders epoch 0 as 1970.
            - metric_name: wow_account_last_login_timestamp_seconds
              type: gauge
              help: "Unix time of an account's last successful login, 0 if never."
              key_labels: [account, gmlevel, expansion]
              values: [ts]
              query: |
                SELECT a.username AS account, IFNULL(aa.gmlevel, 0) AS gmlevel,
                  a.expansion AS expansion,
                  IFNULL(UNIX_TIMESTAMP(a.last_login), 0) AS ts
                FROM acore_auth.account a
                LEFT JOIN acore_auth.account_access aa ON aa.id = a.id
            - metric_name: wow_account_characters
              type: gauge
              help: "Characters belonging to an account."
              key_labels: [account]
              values: [total]
              query: |
                SELECT a.username AS account, COUNT(c.guid) AS total
                FROM acore_auth.account a
                LEFT JOIN acore_characters.characters c ON c.account = a.id
                GROUP BY a.username
            # 1 per online character; the labels carry what `online` prints. No
            # rows and therefore no series when the realm is empty, which is why
            # wow_players_online exists separately as a plain count.
            - metric_name: wow_character_online
              type: gauge
              help: "1 while the character is online."
              key_labels: [character_name, account, class, race, level]
              values: [online]
              query: |
                SELECT 1 AS online, c.name AS character_name, a.username AS account,
                  c.level AS level,
                  CASE c.class
                    WHEN 1 THEN 'Warrior' WHEN 2 THEN 'Paladin' WHEN 3 THEN 'Hunter'
                    WHEN 4 THEN 'Rogue'   WHEN 5 THEN 'Priest'  WHEN 6 THEN 'Death Knight'
                    WHEN 7 THEN 'Shaman'  WHEN 8 THEN 'Mage'    WHEN 9 THEN 'Warlock'
                    WHEN 11 THEN 'Druid'  ELSE CONCAT('class-', c.class) END AS class,
                  CASE c.race
                    WHEN 1 THEN 'Human'  WHEN 2 THEN 'Orc'   WHEN 3 THEN 'Dwarf'
                    WHEN 4 THEN 'Night Elf' WHEN 5 THEN 'Undead' WHEN 6 THEN 'Tauren'
                    WHEN 7 THEN 'Gnome'  WHEN 8 THEN 'Troll' WHEN 10 THEN 'Blood Elf'
                    WHEN 11 THEN 'Draenei' ELSE CONCAT('race-', c.race) END AS race
                FROM acore_characters.characters c
                JOIN acore_auth.account a ON a.id = c.account
                WHERE c.online = 1
            # Map positions for the dashboard's Player positions panel. The yards
            # to fake-lon/lat projection and the map tiles in assets/wow-maps
            # come from one math, ported from azerothcore/playermap — see
            # assets/wow-maps/README.md. Two metrics rather than one with a
            # coord label so the dashboard joins on character_name and reads
            # lon/lat straight off the joined frame, no pivot transform.
            # Freshness is bounded by PlayerSaveInterval (60s here, 15min stock).
            - metric_name: wow_character_position_lon
              type: gauge
              help: "Map longitude of an online character."
              key_labels: [character_name, continent]
              values: [lon]
              query: |
                SELECT c.name AS character_name,
                  CASE
                    WHEN c.map IN (0, 1, 609) THEN 'Azeroth'
                    WHEN c.map = 571 THEN 'Northrend'
                    WHEN c.map = 530 AND NOT (c.position_y < -1000 AND c.position_y > -10000 AND c.position_x > 5000)
                                      AND NOT (c.position_y < -7000 AND c.position_x < 0) THEN 'Outland'
                    ELSE 'Azeroth'
                  END AS continent,
                  CASE
                    WHEN c.map = 0 THEN (752 - ROUND(c.position_y * 0.025140)) / 966.0 * 26.393442623
                    WHEN c.map = 1 THEN (194 - ROUND(c.position_y * 0.025140)) / 966.0 * 26.393442623
                    WHEN c.map = 609 THEN (896 - ROUND((c.position_y + 5662) * 0.025140)) / 966.0 * 26.393442623
                    WHEN c.map = 571 THEN (505 - ROUND(c.position_y * 0.050085)) / 966.0 * 26.393442623
                    WHEN c.map = 530 AND c.position_y < -1000 AND c.position_y > -10000 AND c.position_x > 5000
                      THEN (858 - ROUND((c.position_y + 6357) * 0.025140)) / 966.0 * 26.393442623
                    WHEN c.map = 530 AND c.position_y < -7000 AND c.position_x < 0
                      THEN (103 - ROUND((c.position_y + 13931) * 0.025140)) / 966.0 * 26.393442623
                    ELSE (684 - ROUND((c.position_y - 1265) * 0.051446)) / 966.0 * 27.798561151
                  END AS lon
                FROM acore_characters.characters c
                WHERE c.online = 1
            # The other half of the position pair; the dashboard joins the two
            # on character_name. Carries no continent label — one copy between
            # the pair is enough, and a duplicate would collide in the join.
            - metric_name: wow_character_position_lat
              type: gauge
              help: "Map latitude of an online character."
              key_labels: [character_name]
              values: [lat]
              query: |
                SELECT c.name AS character_name,
                  CASE
                    WHEN c.map = 0 THEN 10 - (291 - ROUND(c.position_x * 0.025140)) / 732.0 * 20
                    WHEN c.map = 1 THEN 10 - (398 - ROUND(c.position_x * 0.025140)) / 732.0 * 20
                    WHEN c.map = 609 THEN 10 - (232 - ROUND((c.position_x - 2355) * 0.025140)) / 732.0 * 20
                    WHEN c.map = 571 THEN 10 - (642 - ROUND(c.position_x * 0.050085)) / 732.0 * 20
                    WHEN c.map = 530 AND c.position_y < -1000 AND c.position_y > -10000 AND c.position_x > 5000
                      THEN 10 - (84 - ROUND((c.position_x - 10349) * 0.025140)) / 732.0 * 20
                    WHEN c.map = 530 AND c.position_y < -7000 AND c.position_x < 0
                      THEN 10 - (261 - ROUND((c.position_x + 3961) * 0.025140)) / 732.0 * 20
                    ELSE 10 - (229 - ROUND((c.position_x - 3070) * 0.051446)) / 695.0 * 20
                  END AS lat
                FROM acore_characters.characters c
                WHERE c.online = 1
            # Zone IDs of online characters, resolved to names for the same
            # reason class and race are: the dashboard reads them directly.
            - metric_name: wow_character_zone
              type: gauge
              help: "Online characters currently in the zone."
              key_labels: [zone]
              values: [online]
              query: |
                SELECT COUNT(*) AS online, CASE c.zone
                  WHEN 1 THEN 'Dun Morogh' WHEN 3 THEN 'Badlands' WHEN 4 THEN 'Blasted Lands'
                  WHEN 8 THEN 'Swamp of Sorrows' WHEN 9 THEN 'Stranglethorn Vale'
                  WHEN 10 THEN 'Darkshore' WHEN 11 THEN 'Wetlands' WHEN 12 THEN 'Elwynn Forest'
                  WHEN 14 THEN 'Durotar' WHEN 15 THEN 'Dustwallow Marsh' WHEN 16 THEN 'Azshara'
                  WHEN 17 THEN 'The Barrens' WHEN 33 THEN 'Stranglethorn Vale'
                  WHEN 36 THEN 'Alterac Mountains' WHEN 38 THEN 'Loch Modan'
                  WHEN 40 THEN 'Westfall' WHEN 41 THEN 'Deadwind Pass' WHEN 44 THEN 'Redridge Mountains'
                  WHEN 45 THEN 'Arathi Highlands' WHEN 46 THEN 'Burning Steppes'
                  WHEN 47 THEN 'The Hinterlands' WHEN 51 THEN 'Searing Gorge'
                  WHEN 65 THEN 'Dragonblight' WHEN 66 THEN 'Zul\'Drak' WHEN 67 THEN 'Storm Peaks'
                  WHEN 85 THEN 'Tirisfal Glades' WHEN 130 THEN 'Silverpine Forest'
                  WHEN 139 THEN 'Eastern Plaguelands' WHEN 141 THEN 'Teldrassil'
                  WHEN 148 THEN 'Ysera\'s Terrace' WHEN 215 THEN 'Mulgore'
                  WHEN 267 THEN 'Hilsbrad Foothills' WHEN 331 THEN 'Ashenvale'
                  WHEN 357 THEN 'Feralas' WHEN 361 THEN 'Felwood'
                  WHEN 400 THEN 'Thousand Needles' WHEN 405 THEN 'Desolace'
                  WHEN 406 THEN 'Stonetalon Mountains' WHEN 440 THEN 'Tanaris'
                  WHEN 490 THEN 'Un\'Goro Crater' WHEN 493 THEN 'Moonglade'
                  WHEN 495 THEN 'Howling Fjord' WHEN 497 THEN 'Borean Tundra'
                  WHEN 498 THEN 'Sholazar Basin' WHEN 501 THEN 'Crystalsong Forest'
                  WHEN 502 THEN 'Zul\'Drak' WHEN 528 THEN 'Duskwood'
                  WHEN 618 THEN 'Winterspring' WHEN 718 THEN 'The Exodar'
                  WHEN 719 THEN 'Shadowmoon Valley' WHEN 720 THEN 'Zangarmarsh'
                  WHEN 721 THEN 'Blade\'s Edge Mountains' WHEN 722 THEN 'Nagrand'
                  WHEN 723 THEN 'Terokkar Forest' WHEN 724 THEN 'Netherstorm'
                  WHEN 796 THEN 'Hellfire Peninsula' WHEN 876 THEN 'Borean Tundra'
                  WHEN 976 THEN 'Grizzly Hills' WHEN 1056 THEN 'Naxxramas'
                  WHEN 1196 THEN 'Utgarde Keep' WHEN 1279 THEN 'Icecrown'
                  WHEN 1296 THEN 'Sholazar Basin' WHEN 1336 THEN 'Nagrand'
                  WHEN 1497 THEN 'Undercity' WHEN 1519 THEN 'Stormwind City'
                  WHEN 1537 THEN 'Ironforge' WHEN 1637 THEN 'Orgrimmar'
                  WHEN 1638 THEN 'Thunder Bluff' WHEN 1657 THEN 'Darnassus'
                  WHEN 1753 THEN 'Eversong Woods' WHEN 1763 THEN 'Tranquillien'
                  WHEN 1779 THEN 'Silvermoon City' WHEN 2100 THEN 'Icecrown Citadel'
                  WHEN 2817 THEN 'Crystalsong Forest' WHEN 3523 THEN 'Borean Tundra'
                  WHEN 3524 THEN 'Borean Tundra' WHEN 3525 THEN 'Borean Tundra'
                  WHEN 3537 THEN 'Borean Tundra' WHEN 3711 THEN 'Sholazar Basin'
                  WHEN 3713 THEN 'Dragonblight' WHEN 3714 THEN 'Grizzly Hills'
                  WHEN 3715 THEN 'Howling Fjord' WHEN 3716 THEN 'Icecrown'
                  WHEN 3717 THEN 'Storm Peaks' WHEN 3718 THEN 'Zul\'Drak'
                  WHEN 3959 THEN 'Dalaran' WHEN 4019 THEN 'Dalaran'
                  WHEN 4100 THEN 'Icecrown Citadel' WHEN 4197 THEN 'Wintergrasp'
                  WHEN 4411 THEN 'Isle of Conquest' WHEN 4710 THEN 'The Storm Peaks'
                  ELSE CONCAT('zone-', c.zone) END AS zone
                FROM acore_characters.characters c
                WHERE c.online = 1
                GROUP BY c.zone
