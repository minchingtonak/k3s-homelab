apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sql-exporter
  namespace: wow
spec:
  interval: 1h
  url: https://burningalchemist.github.io/sql_exporter/
---
# Turns the realm database into Prometheus metrics. There is no AzerothCore
# exporter — the built-in Metric.* options in worldserver.conf speak InfluxDB,
# and standing that up beside an existing Prometheus to read one number is not
# worth it. A database-agnostic SQL exporter is the smaller answer: the data
# ("how many rows have online=1") is already a trivial query.
#
# Lives in the wow namespace rather than monitoring so it sits next to the
# database it reads and the credentials it uses. Prometheus discovers it
# anyway — kube-prometheus-stack runs with serviceMonitorSelectorNilUsesHelmValues
# false, so ServiceMonitors are picked up from every namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wow-sql-exporter
  namespace: wow
spec:
  interval: 1h
  chart:
    spec:
      chart: sql-exporter
      version: "0.18.8" # https://github.com/burningalchemist/sql_exporter/releases
      sourceRef:
        kind: HelmRepository
        name: sql-exporter
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The secret is deliberately NOT named wow-sql-exporter: the chart creates a
  # Secret of that name for its own rendered config, and a collision hands Helm
  # ownership of ours as well.
  valuesFrom:
    - kind: Secret
      name: wow-sql-exporter-dsn
      valuesKey: dsn
      targetPath: config.target.data_source_name
  values:
    fullnameOverride: wow-sql-exporter
    # The DSN authenticates as `wow_exporter`, a dedicated read-only MySQL user
    # rather than root — root in a metrics pod would carry write access to the
    # whole realm for the sake of eight COUNT queries. It exists on wow-database
    # holding exactly:
    #
    #   GRANT SELECT ON acore_characters.* TO 'wow_exporter'@'%';
    #   GRANT SELECT ON acore_auth.*       TO 'wow_exporter'@'%';
    #   GRANT SELECT ON acore_world.player_xp_for_level TO 'wow_exporter'@'%';
    #
    # The third is table-scoped rather than schema-wide on purpose: it is the one
    # world table any metric reads, and acore_world is otherwise none of the
    # exporter's business. wow_character_xp_total depends on it — if that grant
    # goes missing the metric disappears silently, so recreate the user with all
    # three or that graph goes flat with no error anywhere.
    #
    # UPDATE and reads of mysql.* are both denied. A realm wipe does not drop the
    # user — that only drops the acore_* schemas. To rotate:
    #   sops k8s/apps/wow/sql-exporter-dsn.sops.yaml
    #
    # The DSN is a plain URL — mysql://user:pass@host:port/dbname
    serviceMonitor:
      enabled: true
      interval: 30s
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
    config:
      global:
        scrape_timeout: 10s
        scrape_timeout_offset: 500ms
        min_interval: 0s
        max_connections: 3
        max_idle_connections: 3
      target:
        # data_source_name is absent on purpose — valuesFrom above supplies it.
        collectors:
          - wow
      collectors:
        - collector_name: wow
          # The realm is polled, not pushed to, so there is no value in querying
          # faster than the ServiceMonitor scrapes.
          min_interval: 30s
          metrics:
            - metric_name: wow_players_online
              type: gauge
              help: "Characters currently online."
              values: [online]
              query: |
                SELECT COUNT(*) AS online FROM acore_characters.characters WHERE online = 1
            - metric_name: wow_accounts_online
              type: gauge
              help: "Accounts currently logged in."
              values: [online]
              query: |
                SELECT COUNT(*) AS online FROM acore_auth.account WHERE online = 1
            - metric_name: wow_characters_total
              type: gauge
              help: "Characters that exist on the realm."
              values: [total]
              query: |
                SELECT COUNT(*) AS total FROM acore_characters.characters
            - metric_name: wow_accounts_total
              type: gauge
              help: "Accounts that exist on the realm."
              values: [total]
              query: |
                SELECT COUNT(*) AS total FROM acore_auth.account
            # Names are resolved here rather than by Grafana value mappings.
            # They live in the client's DBC files, so either way it is a static
            # lookup — doing it in SQL keeps it in one place and makes the metric
            # self-describing, so PromQL and alerts read wow_characters_by_class
            # {class="Hunter"} instead of {class="3"}.
            - metric_name: wow_characters_by_class
              type: gauge
              help: "Characters by class."
              key_labels: [class]
              values: [total]
              query: |
                SELECT COUNT(*) AS total, CASE class
                  WHEN 1 THEN 'Warrior' WHEN 2 THEN 'Paladin' WHEN 3 THEN 'Hunter'
                  WHEN 4 THEN 'Rogue'   WHEN 5 THEN 'Priest'  WHEN 6 THEN 'Death Knight'
                  WHEN 7 THEN 'Shaman'  WHEN 8 THEN 'Mage'    WHEN 9 THEN 'Warlock'
                  WHEN 11 THEN 'Druid'  ELSE CONCAT('class-', class) END AS class
                FROM acore_characters.characters GROUP BY class
            - metric_name: wow_characters_by_race
              type: gauge
              help: "Characters by race."
              key_labels: [race]
              values: [total]
              query: |
                SELECT COUNT(*) AS total, CASE race
                  WHEN 1 THEN 'Human'  WHEN 2 THEN 'Orc'   WHEN 3 THEN 'Dwarf'
                  WHEN 4 THEN 'Night Elf' WHEN 5 THEN 'Undead' WHEN 6 THEN 'Tauren'
                  WHEN 7 THEN 'Gnome'  WHEN 8 THEN 'Troll' WHEN 10 THEN 'Blood Elf'
                  WHEN 11 THEN 'Draenei' ELSE CONCAT('race-', race) END AS race
                FROM acore_characters.characters GROUP BY race
            - metric_name: wow_character_level_max
              type: gauge
              help: "Highest character level on the realm."
              values: [level]
              query: |
                SELECT IFNULL(MAX(level), 0) AS level FROM acore_characters.characters
            # Total experience earned, not experience into the current level.
            # characters.xp resets to 0 on every ding, so graphing it raw draws a
            # sawtooth that says nothing about progress. Summing the experience
            # every completed level cost turns it into a monotonic curve.
            #
            # The per-level costs are joined from acore_world.player_xp_for_level
            # rather than baked in, so retuning the levelling curve in the DB
            # shows up here without editing this file. That table needs its own
            # grant (see the DSN comment above) because wow_exporter is otherwise
            # scoped to acore_characters and acore_auth.
            #
            # Offline characters included, so a curve does not flatten on logout.
            - metric_name: wow_character_xp_total
              type: gauge
              help: "Total experience a character has earned across all levels."
              key_labels: [character_name]
              values: [xp_total]
              query: |
                SELECT c.name AS character_name,
                  c.xp + IFNULL((SELECT SUM(x.Experience)
                                 FROM acore_world.player_xp_for_level x
                                 WHERE x.Level < c.level), 0) AS xp_total
                FROM acore_characters.characters c
            # Client-reported round-trip time, keyed on the account rather than
            # the character. Latency belongs to the WorldSession — the TCP
            # connection — and a session belongs to an account; it only lands on
            # the character row because that is what SaveToDB writes. Keying it
            # on the character would also break the line on every alt switch:
            # four of five accounts here have two characters, so "Andrew" ending
            # and "Sasuke" starting would look like a reconnect when it is one
            # person on one unbroken connection.
            #
            # MAX + GROUP BY is belt and braces. WoW allows one character online
            # per account, so the group is always a single row today.
            #
            # Online only: the column keeps its last value after logout, so
            # including offline characters would fold hours-old readings from
            # ended sessions into the live percentiles. latency=0 means "never
            # measured" rather than a 0ms link, so it is excluded too.
            #
            # A plain gauge, not a histogram: sql_exporter runs a query and
            # reports the result, it never observes a stream, so it cannot fill
            # buckets. Percentiles come from PromQL's quantile() aggregating
            # across the accounts online at each instant.
            # Freshness is bounded by PlayerSaveInterval, same as position.
            - metric_name: wow_account_latency_ms
              type: gauge
              help: "Client round-trip time of a logged-in account, in milliseconds."
              key_labels: [account]
              values: [latency]
              query: |
                SELECT a.username AS account, MAX(c.latency) AS latency
                FROM acore_characters.characters c
                JOIN acore_auth.account a ON a.id = c.account
                WHERE c.online = 1 AND c.latency > 0
                GROUP BY a.username
            # Level as a *value*, not a label. wow_character_online and
            # wow_character_playtime_seconds both carry `level`, but a label
            # cannot be graphed — PromQL has no label-to-number conversion, and
            # every ding would start a new series rather than move a line. This
            # covers offline characters too, so the curve does not go flat the
            # moment someone logs out. One series per character.
            - metric_name: wow_character_level
              type: gauge
              help: "Current level of a character."
              key_labels: [character_name]
              values: [level]
              query: |
                SELECT c.name AS character_name, c.level AS level
                FROM acore_characters.characters c
            - metric_name: wow_playtime_seconds_total
              type: gauge
              help: "Summed played time across all characters, in seconds."
              values: [seconds]
              query: |
                SELECT IFNULL(SUM(totaltime), 0) AS seconds FROM acore_characters.characters
            - metric_name: wow_accounts_active
              type: gauge
              help: "Accounts with a successful login inside the period."
              key_labels: [period]
              values: [total]
              query: |
                SELECT '24h' AS period, COUNT(*) AS total FROM acore_auth.account
                  WHERE last_login > NOW() - INTERVAL 1 DAY
                UNION ALL
                SELECT '7d' AS period, COUNT(*) AS total FROM acore_auth.account
                  WHERE last_login > NOW() - INTERVAL 7 DAY
            - metric_name: wow_accounts_never_logged_in
              type: gauge
              help: "Accounts created but never used — handed out and unclaimed."
              values: [total]
              query: |
                SELECT COUNT(*) AS total FROM acore_auth.account WHERE last_login IS NULL
            # Per-character series. Cardinality is one series per character, which
            # is nothing at this realm's size but would not suit a public server.
            # Carries the whole per-character row: the value is playtime, the
            # labels are everything the roster table shows. `online` flips as
            # players come and go, which mints a second series per character;
            # the idle one goes stale and Prometheus drops it.
            - metric_name: wow_character_playtime_seconds
              type: gauge
              help: "Played time per character, in seconds."
              key_labels: [character_name, account, class, race, level, online]
              values: [seconds]
              query: |
                SELECT c.name AS character_name, a.username AS account,
                  c.level AS level, c.totaltime AS seconds,
                  IF(c.online = 1, 'yes', 'no') AS online,
                  CASE c.class
                    WHEN 1 THEN 'Warrior' WHEN 2 THEN 'Paladin' WHEN 3 THEN 'Hunter'
                    WHEN 4 THEN 'Rogue'   WHEN 5 THEN 'Priest'  WHEN 6 THEN 'Death Knight'
                    WHEN 7 THEN 'Shaman'  WHEN 8 THEN 'Mage'    WHEN 9 THEN 'Warlock'
                    WHEN 11 THEN 'Druid'  ELSE CONCAT('class-', c.class) END AS class,
                  CASE c.race
                    WHEN 1 THEN 'Human'  WHEN 2 THEN 'Orc'   WHEN 3 THEN 'Dwarf'
                    WHEN 4 THEN 'Night Elf' WHEN 5 THEN 'Undead' WHEN 6 THEN 'Tauren'
                    WHEN 7 THEN 'Gnome'  WHEN 8 THEN 'Troll' WHEN 10 THEN 'Blood Elf'
                    WHEN 11 THEN 'Draenei' ELSE CONCAT('race-', c.race) END AS race
                FROM acore_characters.characters c
                JOIN acore_auth.account a ON a.id = c.account
            # Per-account pair, joined on `account` in the dashboard table. Split
            # because one Prometheus metric carries one value, and both the login
            # time and the character count are worth showing.
            #
            # Never-logged-in accounts report 0 rather than being omitted, so they
            # still appear in the roster — Grafana renders epoch 0 as 1970.
            - metric_name: wow_account_last_login_timestamp_seconds
              type: gauge
              help: "Unix time of an account's last successful login, 0 if never."
              key_labels: [account, gmlevel, expansion]
              values: [ts]
              query: |
                SELECT a.username AS account, IFNULL(aa.gmlevel, 0) AS gmlevel,
                  a.expansion AS expansion,
                  IFNULL(UNIX_TIMESTAMP(a.last_login), 0) AS ts
                FROM acore_auth.account a
                LEFT JOIN acore_auth.account_access aa ON aa.id = a.id
            - metric_name: wow_account_characters
              type: gauge
              help: "Characters belonging to an account."
              key_labels: [account]
              values: [total]
              query: |
                SELECT a.username AS account, COUNT(c.guid) AS total
                FROM acore_auth.account a
                LEFT JOIN acore_characters.characters c ON c.account = a.id
                GROUP BY a.username
            # 1 per online character; the labels carry what `online` prints. No
            # rows and therefore no series when the realm is empty, which is why
            # wow_players_online exists separately as a plain count.
            - metric_name: wow_character_online
              type: gauge
              help: "1 while the character is online."
              key_labels: [character_name, account, class, race, level]
              values: [online]
              query: |
                SELECT 1 AS online, c.name AS character_name, a.username AS account,
                  c.level AS level,
                  CASE c.class
                    WHEN 1 THEN 'Warrior' WHEN 2 THEN 'Paladin' WHEN 3 THEN 'Hunter'
                    WHEN 4 THEN 'Rogue'   WHEN 5 THEN 'Priest'  WHEN 6 THEN 'Death Knight'
                    WHEN 7 THEN 'Shaman'  WHEN 8 THEN 'Mage'    WHEN 9 THEN 'Warlock'
                    WHEN 11 THEN 'Druid'  ELSE CONCAT('class-', c.class) END AS class,
                  CASE c.race
                    WHEN 1 THEN 'Human'  WHEN 2 THEN 'Orc'   WHEN 3 THEN 'Dwarf'
                    WHEN 4 THEN 'Night Elf' WHEN 5 THEN 'Undead' WHEN 6 THEN 'Tauren'
                    WHEN 7 THEN 'Gnome'  WHEN 8 THEN 'Troll' WHEN 10 THEN 'Blood Elf'
                    WHEN 11 THEN 'Draenei' ELSE CONCAT('race-', c.race) END AS race
                FROM acore_characters.characters c
                JOIN acore_auth.account a ON a.id = c.account
                WHERE c.online = 1
            # Map positions for the dashboard's Player positions panel. The yards
            # to fake-lon/lat projection and the map tiles in assets/wow-maps
            # come from one math, ported from azerothcore/playermap — see
            # assets/wow-maps/README.md. Two metrics rather than one with a
            # coord label so the dashboard joins on character_name and reads
            # lon/lat straight off the joined frame, no pivot transform.
            # Freshness is bounded by PlayerSaveInterval (30s here, 15min stock).
            #
            # Both queries are restricted to the five maps the projection covers.
            # Without that, a character inside a dungeon, raid or battleground
            # falls through the ELSE of both CASEs: the continent reads 'Azeroth'
            # while the coordinates are computed with the *Outland* math, which
            # plots a garbage point in the sea off Eastern Kingdoms. It is not a
            # rounding artefact — one such sample decoded to 270 yards from the
            # Icecrown Citadel entrance on map 631. Instance interiors have no
            # place on a continent map, so the right answer is no series at all;
            # the character still shows up in the roster with its zone name.
            # The filter also makes both ELSE branches correct by construction
            # rather than by accident: the only map left reaching them is 530.
            - metric_name: wow_character_position_lon
              type: gauge
              help: "Map longitude of an online character."
              key_labels: [character_name, continent]
              values: [lon]
              query: |
                SELECT c.name AS character_name,
                  CASE
                    WHEN c.map IN (0, 1, 609) THEN 'Azeroth'
                    WHEN c.map = 571 THEN 'Northrend'
                    WHEN c.map = 530 AND NOT (c.position_y < -1000 AND c.position_y > -10000 AND c.position_x > 5000)
                                      AND NOT (c.position_y < -7000 AND c.position_x < 0) THEN 'Outland'
                    ELSE 'Azeroth'
                  END AS continent,
                  CASE
                    WHEN c.map = 0 THEN (752 - ROUND(c.position_y * 0.025140)) / 966.0 * 26.393442623
                    WHEN c.map = 1 THEN (194 - ROUND(c.position_y * 0.025140)) / 966.0 * 26.393442623
                    WHEN c.map = 609 THEN (896 - ROUND((c.position_y + 5662) * 0.025140)) / 966.0 * 26.393442623
                    WHEN c.map = 571 THEN (505 - ROUND(c.position_y * 0.050085)) / 966.0 * 26.393442623
                    WHEN c.map = 530 AND c.position_y < -1000 AND c.position_y > -10000 AND c.position_x > 5000
                      THEN (858 - ROUND((c.position_y + 6357) * 0.025140)) / 966.0 * 26.393442623
                    WHEN c.map = 530 AND c.position_y < -7000 AND c.position_x < 0
                      THEN (103 - ROUND((c.position_y + 13931) * 0.025140)) / 966.0 * 26.393442623
                    ELSE (684 - ROUND((c.position_y - 1265) * 0.051446)) / 966.0 * 27.798561151
                  END AS lon
                FROM acore_characters.characters c
                WHERE c.online = 1 AND c.map IN (0, 1, 530, 571, 609)
            # The other half of the position pair; the dashboard joins the two
            # on character_name. Carries no continent label — one copy between
            # the pair is enough, and a duplicate would collide in the join.
            - metric_name: wow_character_position_lat
              type: gauge
              help: "Map latitude of an online character."
              key_labels: [character_name]
              values: [lat]
              query: |
                SELECT c.name AS character_name,
                  CASE
                    WHEN c.map = 0 THEN 10 - (291 - ROUND(c.position_x * 0.025140)) / 732.0 * 20
                    WHEN c.map = 1 THEN 10 - (398 - ROUND(c.position_x * 0.025140)) / 732.0 * 20
                    WHEN c.map = 609 THEN 10 - (232 - ROUND((c.position_x - 2355) * 0.025140)) / 732.0 * 20
                    WHEN c.map = 571 THEN 10 - (642 - ROUND(c.position_x * 0.050085)) / 732.0 * 20
                    WHEN c.map = 530 AND c.position_y < -1000 AND c.position_y > -10000 AND c.position_x > 5000
                      THEN 10 - (84 - ROUND((c.position_x - 10349) * 0.025140)) / 732.0 * 20
                    WHEN c.map = 530 AND c.position_y < -7000 AND c.position_x < 0
                      THEN 10 - (261 - ROUND((c.position_x + 3961) * 0.025140)) / 732.0 * 20
                    ELSE 10 - (229 - ROUND((c.position_x - 3070) * 0.051446)) / 695.0 * 20
                  END AS lat
                FROM acore_characters.characters c
                WHERE c.online = 1 AND c.map IN (0, 1, 530, 571, 609)
            # Zone IDs of online characters, resolved to names for the same
            # reason class and race are: the dashboard reads them directly.
            # One series per character rather than a COUNT(*) per zone, so the
            # map tooltip can name the zone a marker is standing in; the zone
            # table gets its counts from `count by (zone)` instead of SQL.
            # Names are the full 3.3.5 area table (2264 zones), generated from
            # azerothcore/playermap zone_names_english.php; Zul'Drak-style names
            # are SQL-escaped as Zul''Drak.
            #
            # This one cannot become a join, and the reason is not permissions:
            # acore_world.areatable_dbc is empty. AzerothCore leaves it that way
            # because zone names live in the client's DBC files that the
            # worldserver reads at startup, never in MySQL — joining against it
            # returns NULL for every zone. Granting the exporter access to it
            # would change nothing. Contrast player_xp_for_level above, which is
            # genuinely populated and therefore is joined.
            - metric_name: wow_character_zone
              type: gauge
              help: "1 while the character is in the zone."
              key_labels: [character_name, zone]
              values: [online]
              query: |
                SELECT 1 AS online, c.name AS character_name, CASE c.zone
                  WHEN 1 THEN 'Dun Morogh' WHEN 2 THEN 'Longshore' WHEN 3 THEN 'Badlands'
                  WHEN 4 THEN 'Blasted Lands' WHEN 7 THEN 'Blackwater Cove' WHEN 8 THEN 'Swamp of Sorrows'
                  WHEN 9 THEN 'Northshire Valley' WHEN 10 THEN 'Duskwood' WHEN 11 THEN 'Wetlands'
                  WHEN 12 THEN 'Elwynn Forest' WHEN 13 THEN 'The World Tree' WHEN 14 THEN 'Durotar'
                  WHEN 15 THEN 'Dustwallow Marsh' WHEN 16 THEN 'Azshara' WHEN 17 THEN 'The Barrens'
                  WHEN 18 THEN 'Crystal Lake' WHEN 19 THEN 'Zul''Gurub' WHEN 20 THEN 'Moonbrook'
                  WHEN 21 THEN 'Kul Tiras' WHEN 22 THEN 'Programmer Isle' WHEN 23 THEN 'Northshire River'
                  WHEN 24 THEN 'Northshire Abbey' WHEN 25 THEN 'Blackrock Mountain' WHEN 26 THEN 'Lighthouse'
                  WHEN 28 THEN 'Western Plaguelands' WHEN 30 THEN 'Nine' WHEN 32 THEN 'The Cemetary'
                  WHEN 33 THEN 'Stranglethorn Vale' WHEN 34 THEN 'Echo Ridge Mine' WHEN 35 THEN 'Booty Bay'
                  WHEN 36 THEN 'Alterac Mountains' WHEN 37 THEN 'Lake Nazferiti' WHEN 38 THEN 'Loch Modan'
                  WHEN 40 THEN 'Westfall' WHEN 41 THEN 'Deadwind Pass' WHEN 42 THEN 'Darkshire'
                  WHEN 43 THEN 'Wild Shore' WHEN 44 THEN 'Redridge Mountains' WHEN 45 THEN 'Arathi Highlands'
                  WHEN 46 THEN 'Burning Steppes' WHEN 47 THEN 'The Hinterlands'
                  WHEN 49 THEN 'Dead Man''s Hole' WHEN 51 THEN 'Searing Gorge' WHEN 53 THEN 'Thieves Camp'
                  WHEN 54 THEN 'Jasperlode Mine' WHEN 55 THEN 'Valley of Heroes UNUSED'
                  WHEN 56 THEN 'Heroes'' Vigil' WHEN 57 THEN 'Fargodeep Mine'
                  WHEN 59 THEN 'Northshire Vineyards' WHEN 60 THEN 'Forest''s Edge'
                  WHEN 61 THEN 'Thunder Falls' WHEN 62 THEN 'Brackwell Pumpkin Patch'
                  WHEN 63 THEN 'The Stonefield Farm' WHEN 64 THEN 'The Maclure Vineyards'
                  WHEN 65 THEN 'Dragonblight' WHEN 66 THEN 'Zul''Drak' WHEN 67 THEN 'The Storm Peaks'
                  WHEN 68 THEN 'Lake Everstill' WHEN 69 THEN 'Lakeshire' WHEN 70 THEN 'Stonewatch'
                  WHEN 71 THEN 'Stonewatch Falls' WHEN 72 THEN 'The Dark Portal'
                  WHEN 73 THEN 'The Tainted Scar' WHEN 74 THEN 'Pool of Tears' WHEN 75 THEN 'Stonard'
                  WHEN 76 THEN 'Fallow Sanctuary' WHEN 77 THEN 'Anvilmar' WHEN 80 THEN 'Stormwind Mountains'
                  WHEN 81 THEN 'Jeff NE Quadrant Changed' WHEN 82 THEN 'Jeff NW Quadrant'
                  WHEN 83 THEN 'Jeff SE Quadrant' WHEN 84 THEN 'Jeff SW Quadrant'
                  WHEN 85 THEN 'Tirisfal Glades' WHEN 86 THEN 'Stone Cairn Lake' WHEN 87 THEN 'Goldshire'
                  WHEN 88 THEN 'Eastvale Logging Camp' WHEN 89 THEN 'Mirror Lake Orchard'
                  WHEN 91 THEN 'Tower of Azora' WHEN 92 THEN 'Mirror Lake' WHEN 93 THEN 'Vul''Gol Ogre Mound'
                  WHEN 94 THEN 'Raven Hill' WHEN 95 THEN 'Redridge Canyons' WHEN 96 THEN 'Tower of Ilgalar'
                  WHEN 97 THEN 'Alther''s Mill' WHEN 98 THEN 'Rethban Caverns' WHEN 99 THEN 'Rebel Camp'
                  WHEN 100 THEN 'Nesingwary''s Expedition' WHEN 101 THEN 'Kurzen''s Compound'
                  WHEN 102 THEN 'Ruins of Zul''Kunda' WHEN 103 THEN 'Ruins of Zul''Mamwe'
                  WHEN 104 THEN 'The Vile Reef' WHEN 105 THEN 'Mosh''Ogg Ogre Mound'
                  WHEN 106 THEN 'The Stockpile' WHEN 107 THEN 'Saldean''s Farm' WHEN 108 THEN 'Sentinel Hill'
                  WHEN 109 THEN 'Furlbrow''s Pumpkin Farm' WHEN 111 THEN 'Jangolode Mine'
                  WHEN 113 THEN 'Gold Coast Quarry' WHEN 115 THEN 'Westfall Lighthouse'
                  WHEN 116 THEN 'Misty Valley' WHEN 117 THEN 'Grom''gol Base Camp'
                  WHEN 118 THEN 'Whelgar''s Excavation Site' WHEN 120 THEN 'Westbrook Garrison'
                  WHEN 121 THEN 'Tranquil Gardens Cemetery' WHEN 122 THEN 'Zuuldaia Ruins'
                  WHEN 123 THEN 'Bal''lal Ruins' WHEN 125 THEN 'Kal''ai Ruins' WHEN 126 THEN 'Tkashi Ruins'
                  WHEN 127 THEN 'Balia''mah Ruins' WHEN 128 THEN 'Ziata''jai Ruins'
                  WHEN 129 THEN 'Mizjah Ruins' WHEN 130 THEN 'Silverpine Forest' WHEN 131 THEN 'Kharanos'
                  WHEN 132 THEN 'Coldridge Valley' WHEN 133 THEN 'Gnomeregan'
                  WHEN 134 THEN 'Gol''Bolar Quarry' WHEN 135 THEN 'Frostmane Hold'
                  WHEN 136 THEN 'The Grizzled Den' WHEN 137 THEN 'Brewnall Village'
                  WHEN 138 THEN 'Misty Pine Refuge' WHEN 139 THEN 'Eastern Plaguelands'
                  WHEN 141 THEN 'Teldrassil' WHEN 142 THEN 'Ironband''s Excavation Site'
                  WHEN 143 THEN 'Mo''grosh Stronghold' WHEN 144 THEN 'Thelsamar' WHEN 145 THEN 'Algaz Gate'
                  WHEN 146 THEN 'Stonewrought Dam' WHEN 147 THEN 'The Farstrider Lodge'
                  WHEN 148 THEN 'Darkshore' WHEN 149 THEN 'Silver Stream Mine'
                  WHEN 150 THEN 'Menethil Harbor' WHEN 151 THEN 'Designer Island' WHEN 152 THEN 'The Bulwark'
                  WHEN 153 THEN 'Ruins of Lordaeron' WHEN 154 THEN 'Deathknell'
                  WHEN 155 THEN 'Night Web''s Hollow' WHEN 156 THEN 'Solliden Farmstead'
                  WHEN 157 THEN 'Agamand Mills' WHEN 158 THEN 'Agamand Family Crypt' WHEN 159 THEN 'Brill'
                  WHEN 160 THEN 'Whispering Gardens' WHEN 161 THEN 'Terrace of Repose'
                  WHEN 162 THEN 'Brightwater Lake' WHEN 163 THEN 'Gunther''s Retreat'
                  WHEN 164 THEN 'Garren''s Haunt' WHEN 165 THEN 'Balnir Farmstead'
                  WHEN 166 THEN 'Cold Hearth Manor' WHEN 167 THEN 'Crusader Outpost'
                  WHEN 168 THEN 'The North Coast' WHEN 169 THEN 'Whispering Shore'
                  WHEN 170 THEN 'Lordamere Lake' WHEN 172 THEN 'Fenris Isle' WHEN 173 THEN 'Faol''s Rest'
                  WHEN 186 THEN 'Dolanaar' WHEN 187 THEN 'Darnassus UNUSED' WHEN 188 THEN 'Shadowglen'
                  WHEN 189 THEN 'Steelgrill''s Depot' WHEN 190 THEN 'Hearthglen'
