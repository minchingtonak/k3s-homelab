apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sql-exporter
  namespace: wow
spec:
  interval: 1h
  url: https://burningalchemist.github.io/sql_exporter/
---
# Turns the realm database into Prometheus metrics. There is no AzerothCore
# exporter — the built-in Metric.* options in worldserver.conf speak InfluxDB,
# and standing that up beside an existing Prometheus to read one number is not
# worth it. A database-agnostic SQL exporter is the smaller answer: the data
# ("how many rows have online=1") is already a trivial query.
#
# Lives in the wow namespace rather than monitoring so it sits next to the
# database it reads and the credentials it uses. Prometheus discovers it
# anyway — kube-prometheus-stack runs with serviceMonitorSelectorNilUsesHelmValues
# false, so ServiceMonitors are picked up from every namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wow-sql-exporter
  namespace: wow
spec:
  interval: 1h
  chart:
    spec:
      chart: sql-exporter
      version: "0.18.8" # https://github.com/burningalchemist/sql_exporter/releases
      sourceRef:
        kind: HelmRepository
        name: sql-exporter
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The secret is deliberately NOT named wow-sql-exporter: the chart creates a
  # Secret of that name for its own rendered config, and a collision hands Helm
  # ownership of ours as well.
  valuesFrom:
    - kind: Secret
      name: wow-sql-exporter-dsn
      valuesKey: dsn
      targetPath: config.target.data_source_name
  values:
    fullnameOverride: wow-sql-exporter
    # The DSN authenticates as `wow_exporter`, a dedicated read-only MySQL user
    # rather than root — root in a metrics pod would carry write access to the
    # whole realm for the sake of eight COUNT queries. It exists on wow-database
    # holding exactly:
    #
    #   GRANT SELECT ON acore_characters.* TO 'wow_exporter'@'%';
    #   GRANT SELECT ON acore_auth.*       TO 'wow_exporter'@'%';
    #
    # UPDATE and reads of mysql.* are both denied. A realm wipe does not drop the
    # user — that only drops the acore_* schemas. To rotate:
    #   sops k8s/apps/wow/sql-exporter-dsn.sops.yaml
    #
    # The DSN is a plain URL — mysql://user:pass@host:port/dbname
    serviceMonitor:
      enabled: true
      interval: 30s
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
    config:
      global:
        scrape_timeout: 10s
        scrape_timeout_offset: 500ms
        min_interval: 0s
        max_connections: 3
        max_idle_connections: 3
      target:
        # data_source_name is absent on purpose — valuesFrom above supplies it.
        collectors:
          - wow
      collectors:
        - collector_name: wow
          # The realm is polled, not pushed to, so there is no value in querying
          # faster than the ServiceMonitor scrapes.
          min_interval: 30s
          metrics:
            - metric_name: wow_players_online
              type: gauge
              help: "Characters currently online."
              values: [online]
              query: |
                SELECT COUNT(*) AS online FROM acore_characters.characters WHERE online = 1
            - metric_name: wow_accounts_online
              type: gauge
              help: "Accounts currently logged in."
              values: [online]
              query: |
                SELECT COUNT(*) AS online FROM acore_auth.account WHERE online = 1
            - metric_name: wow_characters_total
              type: gauge
              help: "Characters that exist on the realm."
              values: [total]
              query: |
                SELECT COUNT(*) AS total FROM acore_characters.characters
            - metric_name: wow_accounts_total
              type: gauge
              help: "Accounts that exist on the realm."
              values: [total]
              query: |
                SELECT COUNT(*) AS total FROM acore_auth.account
            # Names are resolved here rather than by Grafana value mappings.
            # They live in the client's DBC files, so either way it is a static
            # lookup — doing it in SQL keeps it in one place and makes the metric
            # self-describing, so PromQL and alerts read wow_characters_by_class
            # {class="Hunter"} instead of {class="3"}.
            - metric_name: wow_characters_by_class
              type: gauge
              help: "Characters by class."
              key_labels: [class]
              values: [total]
              query: |
                SELECT COUNT(*) AS total, CASE class
                  WHEN 1 THEN 'Warrior' WHEN 2 THEN 'Paladin' WHEN 3 THEN 'Hunter'
                  WHEN 4 THEN 'Rogue'   WHEN 5 THEN 'Priest'  WHEN 6 THEN 'Death Knight'
                  WHEN 7 THEN 'Shaman'  WHEN 8 THEN 'Mage'    WHEN 9 THEN 'Warlock'
                  WHEN 11 THEN 'Druid'  ELSE CONCAT('class-', class) END AS class
                FROM acore_characters.characters GROUP BY class
            - metric_name: wow_characters_by_race
              type: gauge
              help: "Characters by race."
              key_labels: [race]
              values: [total]
              query: |
                SELECT COUNT(*) AS total, CASE race
                  WHEN 1 THEN 'Human'  WHEN 2 THEN 'Orc'   WHEN 3 THEN 'Dwarf'
                  WHEN 4 THEN 'Night Elf' WHEN 5 THEN 'Undead' WHEN 6 THEN 'Tauren'
                  WHEN 7 THEN 'Gnome'  WHEN 8 THEN 'Troll' WHEN 10 THEN 'Blood Elf'
                  WHEN 11 THEN 'Draenei' ELSE CONCAT('race-', race) END AS race
                FROM acore_characters.characters GROUP BY race
            - metric_name: wow_character_level_max
              type: gauge
              help: "Highest character level on the realm."
              values: [level]
              query: |
                SELECT IFNULL(MAX(level), 0) AS level FROM acore_characters.characters
            - metric_name: wow_playtime_seconds_total
              type: gauge
              help: "Summed played time across all characters, in seconds."
              values: [seconds]
              query: |
                SELECT IFNULL(SUM(totaltime), 0) AS seconds FROM acore_characters.characters
            - metric_name: wow_accounts_active
              type: gauge
              help: "Accounts with a successful login inside the period."
              key_labels: [period]
              values: [total]
              query: |
                SELECT '24h' AS period, COUNT(*) AS total FROM acore_auth.account
                  WHERE last_login > NOW() - INTERVAL 1 DAY
                UNION ALL
                SELECT '7d' AS period, COUNT(*) AS total FROM acore_auth.account
                  WHERE last_login > NOW() - INTERVAL 7 DAY
            - metric_name: wow_accounts_never_logged_in
              type: gauge
              help: "Accounts created but never used — handed out and unclaimed."
              values: [total]
              query: |
                SELECT COUNT(*) AS total FROM acore_auth.account WHERE last_login IS NULL
            # Per-character series. Cardinality is one series per character, which
            # is nothing at this realm's size but would not suit a public server.
            - metric_name: wow_character_playtime_seconds
              type: gauge
              help: "Played time per character, in seconds."
              key_labels: [character_name]
              values: [seconds]
              query: |
                SELECT name AS character_name, totaltime AS seconds
                FROM acore_characters.characters
            # 1 per online character; the labels carry what `online` prints. No
            # rows and therefore no series when the realm is empty, which is why
            # wow_players_online exists separately as a plain count.
            - metric_name: wow_character_online
              type: gauge
              help: "1 while the character is online."
              key_labels: [character_name, account, class, race, level]
              values: [online]
              query: |
                SELECT 1 AS online, c.name AS character_name, a.username AS account,
                  c.level AS level,
                  CASE c.class
                    WHEN 1 THEN 'Warrior' WHEN 2 THEN 'Paladin' WHEN 3 THEN 'Hunter'
                    WHEN 4 THEN 'Rogue'   WHEN 5 THEN 'Priest'  WHEN 6 THEN 'Death Knight'
                    WHEN 7 THEN 'Shaman'  WHEN 8 THEN 'Mage'    WHEN 9 THEN 'Warlock'
                    WHEN 11 THEN 'Druid'  ELSE CONCAT('class-', c.class) END AS class,
                  CASE c.race
                    WHEN 1 THEN 'Human'  WHEN 2 THEN 'Orc'   WHEN 3 THEN 'Dwarf'
                    WHEN 4 THEN 'Night Elf' WHEN 5 THEN 'Undead' WHEN 6 THEN 'Tauren'
                    WHEN 7 THEN 'Gnome'  WHEN 8 THEN 'Troll' WHEN 10 THEN 'Blood Elf'
                    WHEN 11 THEN 'Draenei' ELSE CONCAT('race-', c.race) END AS race
                FROM acore_characters.characters c
                JOIN acore_auth.account a ON a.id = c.account
                WHERE c.online = 1
