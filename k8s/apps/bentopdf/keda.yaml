apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: bentopdf
  namespace: bentopdf
spec:
  target:
    service: bentopdf
    port: 80
  rules:
    - hosts:
        - bentopdf.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: bentopdf
  namespace: bentopdf
spec:
  scaleTargetRef:
    name: bentopdf
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: bentopdf
