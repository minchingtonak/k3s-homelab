apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: metube
  namespace: metube
spec:
  target:
    service: metube
    port: 80
  rules:
    - hosts:
        - metube.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: metube
  namespace: metube
spec:
  scaleTargetRef:
    name: metube
  minReplicaCount: 0
  cooldownPeriod: 7200
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: metube
