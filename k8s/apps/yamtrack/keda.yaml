apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: yamtrack
  namespace: yamtrack
spec:
  target:
    service: yamtrack
    port: 80
  rules:
    - hosts:
        - yamtrack.item.fyi
  timeouts:
    responseHeader: 30s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: yamtrack
  namespace: yamtrack
spec:
  scaleTargetRef:
    name: yamtrack
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: yamtrack
