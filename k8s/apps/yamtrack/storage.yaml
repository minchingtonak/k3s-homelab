apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yamtrack-db
  namespace: yamtrack
  labels:
    recurring-job.longhorn.io/source: "enabled"
    recurring-job-group.longhorn.io/cold: "enabled"
    recurring-job-group.longhorn.io/default: "disabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yamtrack-redis
  namespace: yamtrack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
