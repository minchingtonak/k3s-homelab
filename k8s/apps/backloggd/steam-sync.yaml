---
# Weekly Steam -> Backloggd tracking nag (seerr unfulfilled-requests
# pattern). Pulls the Steam library once (GetOwnedGames: playtime +
# last-played), signs in to Backloggd as the user to page through their
# library (~a dozen spaced requests/week; no public API, so the job acts
# only on the user's own data with an honest UA and aborts on 429), and
# Pushover-nags about games played since BACKFILL_FROM that Backloggd has
# no entry for. Achievement unlock timestamps approximate started/beat
# dates for the nagged games. The nag repeats weekly until the game shows
# up in Backloggd — stateless and self-healing, no PVC.
#
# BACKFILL_FROM is the ratchet: recent years are logged first, then move
# the date back one step per commit to widen the window through history.
# The Python source lives in scripts/steam_sync.py and is baked into the
# backloggd-steam-sync-script ConfigMap by the configMapGenerator in this
# kustomization (dagu pattern).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backloggd-steam-sync
  namespace: backloggd
  labels:
    app.kubernetes.io/name: backloggd-steam-sync
spec:
  schedule: "0 9 * * 0"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backloggd-steam-sync
        spec:
          restartPolicy: Never
          containers:
            - name: steam-sync
              image: python:3.13-alpine@sha256:1a63a53928ce53d2b0baf08092a703f4840ac5dfbd61fd48802dbf48e08c801e
              command:
                - python3
                - -u
                - /script/steam_sync.py
              envFrom:
                - secretRef:
                    name: backloggd-steam-sync-secret
              env:
                - name: STEAM_API_URL
                  value: https://api.steampowered.com
                - name: BACKLOGGD_URL
                  value: https://backloggd.com
                - name: REPORT_TZ
                  value: America/New_York
                - name: BACKFILL_FROM
                  value: "2026-01-01"
                - name: MIN_PLAYTIME_MINUTES
                  value: "30"
                - name: IGNORE_APPIDS
                  value: "3081410,223850,1938090,212910,271590,275670,870780,203160,10190,388080,211420,1151640,431960,35420"
                - name: MAX_REPORT
                  value: "25"
                - name: ACHIEVEMENT_FETCH_LIMIT
                  value: "60"
                - name: BACKLOGGD_MIN_INTERVAL
                  value: "5"
                - name: BACKLOGGD_MAX_PAGES
                  value: "50"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 100000
                runAsGroup: 100000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: purchase-dates
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: backloggd-steam-sync-script
            - name: purchase-dates
              configMap:
                name: backloggd-purchase-dates
