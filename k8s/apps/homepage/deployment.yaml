apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    traefik: true
  settings.yaml: |
    # https://gethomepage.dev/configs/settings/
    title: "cluster homepage"
    theme: dark
    color: slate
    headerStyle: clean
    useEqualHeights: true
    layout:
      columns: 4
      life: {}
      media: {}
      infrastructure: {}
      monitoring: {}
      servarr: {}
      tools: {}
      development: {}
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: false
      hideVisitURL: false
      provider: custom
      url: https://kagi.com/search?q=
      target: _blank
      suggestionUrl: https://kagi.com/api/autosuggest?q=
  custom.js: ""
  custom.css: ""
  proxmox.yaml: ""
  services.yaml: "[]"
  widgets.yaml: |
    - resources:
        label: storage
        disk: /
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: l
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
    - openmeteo:
        label: Detroit
        latitude: 42.491943
        longitude: -83.023888
        units: imperial
        cache: 5
  docker.yaml: ""
  bookmarks.yaml: |
    - infra:
      - unifi router:
          - icon: unifi.svg
            href: https://192.168.10.1
      - proxmox:
          - icon: proxmox.png
            href: https://192.168.20.89:8006
    - backup & dr:
      - edsac pbs:
          - icon: proxmox-backup-server.svg
            href: https://192.168.20.189:8007
      - cloud pbs:
          - icon: proxmox-backup-server-dark.svg
            href: https://sh19-112.prod.cloud-pbs.com:8007
    - project tools:
      - k3s-homelab github:
          - icon: github.png
            href: https://github.com/minchingtonak/k3s-homelab
      - PaC github:
          - icon: github.png
            href: https://github.com/minchingtonak/PaC
    - notifs:
      - pushover:
          - icon: pushover.png
            href: https://client.pushover.net
      - pushover api:
          - icon: pushover.png
            href: https://api.pushover.net
      - healthchecks:
          - icon: healthchecks.png
            href: https://healthchecks.io
    - apps:
      - pangolin:
          - icon: pangolin.png
            href: https://pangolin.minch.zone
      - nextcloud:
          - icon: nextcloud.png
            href: https://nextcloud.alecminch.dev/
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  annotations:
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
spec:
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.1.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: homepage-secrets
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,homepage.homepage.svc.cluster.local:3000,homepage.item.fyi"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /app/config/custom.js
              name: config
              subPath: custom.js
            - mountPath: /app/config/custom.css
              name: config
              subPath: custom.css
            - mountPath: /app/config/bookmarks.yaml
              name: config
              subPath: bookmarks.yaml
            - mountPath: /app/config/docker.yaml
              name: config
              subPath: docker.yaml
            - mountPath: /app/config/kubernetes.yaml
              name: config
              subPath: kubernetes.yaml
            - mountPath: /app/config/services.yaml
              name: config
              subPath: services.yaml
            - mountPath: /app/config/settings.yaml
              name: config
              subPath: settings.yaml
            - mountPath: /app/config/widgets.yaml
              name: config
              subPath: widgets.yaml
            - mountPath: /app/config/proxmox.yaml
              name: config
              subPath: proxmox.yaml
            - mountPath: /app/config/logs
              name: logs
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
