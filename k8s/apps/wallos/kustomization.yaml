apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wallos
resources:
  - deployment.yaml
  - ingressroute.yaml
  - wallos-oidc.sops.yaml
  - weekly-digest.yaml
  - weekly-digest-secret.sops.yaml
configMapGenerator:
  # CronJob volume references are not rewritten to hashed ConfigMap
  # names, so this generator must keep a stable name.
  - name: wallos-weekly-digest-script
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - weekly_digest.py=scripts/weekly_digest.py
