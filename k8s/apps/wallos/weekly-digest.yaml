---
# Weekly Wallos subscription digest: everything charging in the next
# 7 days with per-currency totals, pushed every Saturday (nothing-due
# weeks get a heartbeat). Works around Wallos's read-only notification
# API. The Python source lives in scripts/weekly_digest.py, baked into
# the wallos-weekly-digest-script ConfigMap by the configMapGenerator
# in this kustomization.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wallos-weekly-digest
  namespace: wallos
  labels:
    app.kubernetes.io/name: wallos-weekly-digest
spec:
  schedule: "15 9 * * 6"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wallos-weekly-digest
        spec:
          restartPolicy: Never
          containers:
            - name: weekly-digest
              image: python:3.15-alpine@sha256:d44b1254cb92329418d164b22b20d86bbd3869d48e80e09e476531a409a728bb
              command:
                - python3
                - -u
                - /script/weekly_digest.py
              envFrom:
                - secretRef:
                    name: wallos-weekly-digest-secret
              env:
                - name: WALLOS_URL
                  value: http://wallos.wallos.svc.cluster.local
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 100000
                runAsGroup: 100000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: wallos-weekly-digest-script
