apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: convertx
  namespace: convertx
spec:
  target:
    service: convertx
    port: 80
  rules:
    - hosts:
        - convertx.item.fyi
  timeouts:
    # Conversions can take a while on large files.
    responseHeader: 120s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: convertx
  namespace: convertx
spec:
  scaleTargetRef:
    name: convertx
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: convertx
