apiVersion: v1
kind: Namespace
metadata:
  name: convertx
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: convertx-data
  namespace: convertx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convertx
  namespace: convertx
  labels:
    app.kubernetes.io/name: convertx
  annotations:
    secret.reloader.stakater.com/reload: convertx
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: convertx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: convertx
    spec:
      containers:
        - name: convertx
          image: ghcr.io/c4illin/convertx:v0.19.0@sha256:a64d03997fa2686608ed31121e090f21eb8e91dfd2eb06a6aba86480deabe8c1
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: convertx
                  key: JWT_SECRET
            - name: ALLOW_UNAUTHENTICATED
              value: "true"
            - name: HTTP_ALLOWED
              value: "true"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: convertx-data
---
apiVersion: v1
kind: Service
metadata:
  name: convertx
  namespace: convertx
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  selector:
    app.kubernetes.io/name: convertx
  ports:
    - port: 80
      targetPort: 3000
      name: http
