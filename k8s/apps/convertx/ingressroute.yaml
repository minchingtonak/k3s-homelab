apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: convertx
  namespace: convertx
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "ConvertX"
    gethomepage.dev/description: "File conversion"
    gethomepage.dev/group: "tools"
    gethomepage.dev/icon: "sh-convertx.png"
    gethomepage.dev/href: "https://convertx.item.fyi"
    gethomepage.dev/siteMonitor: "http://convertx.convertx.svc.cluster.local"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=convertx"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`convertx.item.fyi`)
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        # Routed through the KEDA HTTP add-on interceptor, which buffers
        # requests while the app scales up from zero (keda.yaml in this dir).
        # The authentik middleware stays in front: unauthenticated traffic is
        # rejected before it can trigger a scale-up.
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
  tls: {}
