apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: mazanoke
  namespace: mazanoke
spec:
  target:
    service: mazanoke
    port: 80
  rules:
    - hosts:
        - mazanoke.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mazanoke
  namespace: mazanoke
spec:
  scaleTargetRef:
    name: mazanoke
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: mazanoke
