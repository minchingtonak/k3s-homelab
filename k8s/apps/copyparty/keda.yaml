apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: copyparty
  namespace: copyparty
spec:
  target:
    service: copyparty
    port: 3939
  rules:
    - hosts:
        - copyparty.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: copyparty
  namespace: copyparty
spec:
  scaleTargetRef:
    name: copyparty
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: copyparty
