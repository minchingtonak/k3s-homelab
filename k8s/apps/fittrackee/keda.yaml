apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: fittrackee
  namespace: fittrackee
spec:
  target:
    service: fittrackee
    port: 80
  rules:
    - hosts:
        - fittrackee.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: fittrackee
  namespace: fittrackee
spec:
  scaleTargetRef:
    name: fittrackee
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: fittrackee
