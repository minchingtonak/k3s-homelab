apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm-db
  namespace: romm
  labels:
    app.kubernetes.io/name: romm-db
  annotations:
    secret.reloader.stakater.com/reload: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: romm-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romm-db
    spec:
      containers:
        - name: mariadb
          # https://docs.romm.app/latest/getting-started/quick-start/
          image: docker.io/library/mariadb:12.3@sha256:628f228f0fd5913a220438693576b29b6fe4dc1fa0a1298c0e98579fae28635f
          env:
            - name: MARIADB_DATABASE
              value: romm
            - name: MARIADB_USER
              value: romm-user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: DB_PASSWD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: MARIADB_ROOT_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: romm-db
---
apiVersion: v1
kind: Service
metadata:
  name: romm-db
  namespace: romm
  annotations:
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
spec:
  selector:
    app.kubernetes.io/name: romm-db
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
  labels:
    app.kubernetes.io/name: romm
  annotations:
    secret.reloader.stakater.com/reload: romm
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: romm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romm
    spec:
      # fixes nginx crash caused by ROMM_PORT being injected by k8s. disables injection of that and other vars
      enableServiceLinks: false
      containers:
        - name: romm
          image: docker.io/rommapp/romm:5.1.0@sha256:ce9d86ab531e09fede45d00f426e3bf2d1f5dd14846f94d6360d77a92a413028
          env:
            - name: DB_HOST
              value: romm-db
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm-user
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: DB_PASSWD
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: ROMM_AUTH_SECRET_KEY
            # authentik OIDC - see https://docs.romm.app/latest/administration/oidc/authentik/
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_PROVIDER
              value: authentik
            - name: OIDC_CLIENT_ID
              value: romm
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URI
              value: https://romm.item.fyi/api/oauth/openid
            - name: OIDC_SERVER_APPLICATION_URL
              value: https://auth.item.fyi/application/o/romm
            - name: ROMM_BASE_URL
              value: https://romm.item.fyi
            # metadata providers - see https://docs.romm.app/latest/Getting-Started/Metadata-Providers/
            - name: RETROACHIEVEMENTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: RETROACHIEVEMENTS_API_KEY
            - name: IGDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: IGDB_CLIENT_ID
            - name: IGDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: IGDB_CLIENT_SECRET
            - name: STEAMGRIDDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: STEAMGRIDDB_API_KEY
            - name: HASHEOUS_API_ENABLED
              value: "true"
            - name: HLTB_API_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            # Resources fetched from IGDB (covers, screenshots, etc.)
            - name: resources
              mountPath: /romm/resources
            # Your game library
            - name: library
              mountPath: /romm/library
            # Uploaded saves, states, etc.
            - name: assets
              mountPath: /romm/assets
            # Path where config.yml is stored
            - name: config
              mountPath: /romm/config
            - name: redis
              mountPath: /redis-data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
      volumes:
        - name: resources
          persistentVolumeClaim:
            claimName: romm-resources
        - name: redis
          persistentVolumeClaim:
            claimName: romm-redis
        - name: library
          persistentVolumeClaim:
            claimName: romm-library
        - name: assets
          persistentVolumeClaim:
            claimName: romm-assets
        - name: config
          persistentVolumeClaim:
            claimName: romm-config
---
apiVersion: v1
kind: Service
metadata:
  name: romm
  namespace: romm
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  selector:
    app.kubernetes.io/name: romm
  ports:
    - port: 80
      targetPort: 8080
      name: http
