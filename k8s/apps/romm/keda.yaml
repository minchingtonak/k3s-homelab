apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: romm
  namespace: romm
spec:
  target:
    service: romm
    port: 80
  rules:
    - hosts:
        - romm.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: romm
  namespace: romm
spec:
  scaleTargetRef:
    name: romm
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: romm
