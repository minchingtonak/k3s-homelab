apiVersion: apps/v1
kind: Deployment
metadata:
  name: slaanesh
  namespace: slaanesh
  labels:
    app.kubernetes.io/name: slaanesh
  annotations:
    secret.reloader.stakater.com/reload: slaanesh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slaanesh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slaanesh
    spec:
      # slaanesh runs as uid/gid 1000 (node, per its Dockerfile); fsGroup makes
      # the Longhorn volume group-owned and writable for its sqlite data dir.
      securityContext:
        fsGroup: 1000
      containers:
        - name: slaanesh
          # https://github.com/h-quer/Slaanesh
          image: ghcr.io/h-quer/slaanesh:latest@sha256:677e9dc29d51341d8b4cad9c6009f1b6c7bea151d131d1d2832ba51cb663a961
          env:
            - name: TZ
              value: America/New_York
            # IGDB API credentials - https://api-docs.igdb.com/#account-creation
            - name: IGDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: slaanesh
                  key: IGDB_CLIENT_ID
            - name: IGDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: slaanesh
                  key: IGDB_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 4
            timeoutSeconds: 4
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /usr/src/app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: slaanesh-data
---
apiVersion: v1
kind: Service
metadata:
  name: slaanesh
  namespace: slaanesh
  annotations:
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
spec:
  selector:
    app.kubernetes.io/name: slaanesh
  ports:
    - port: 80
      targetPort: 3000
      name: http
