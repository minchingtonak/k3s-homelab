apiVersion: v1
kind: Namespace
metadata:
  name: dawarich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-postgres
  namespace: dawarich
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-redis
  namespace: dawarich
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-data
  namespace: dawarich
  labels:
    recurring-job.longhorn.io/source: "enabled"
    recurring-job-group.longhorn.io/cold: "enabled"
    recurring-job-group.longhorn.io/default: "disabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-postgres
  namespace: dawarich
  labels:
    app.kubernetes.io/name: dawarich-postgres
  annotations:
    secret.reloader.stakater.com/reload: dawarich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dawarich-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dawarich-postgres
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich
                  key: DATABASE_PASSWORD
            - name: POSTGRES_DB
              value: dawarich_development
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command: [
                "pg_isready",
                "-U",
                "postgres",
                "-d",
                "dawarich_development"
              ]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: shared-mem
              mountPath: /dev/shm
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: dawarich-postgres
        - name: shared-mem
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich-postgres
  namespace: dawarich
  annotations:
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
spec:
  selector:
    app.kubernetes.io/name: dawarich-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-redis
  namespace: dawarich
  labels:
    app.kubernetes.io/name: dawarich-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dawarich-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dawarich-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          command: ["redis-server"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: dawarich-redis
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich-redis
  namespace: dawarich
  annotations:
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
spec:
  selector:
    app.kubernetes.io/name: dawarich-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-app
  namespace: dawarich
  labels:
    app.kubernetes.io/name: dawarich-app
  annotations:
    secret.reloader.stakater.com/reload: dawarich
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dawarich-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dawarich-app
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: dawarich
          image: freikin/dawarich:1.17.0@sha256:207dc86f8baa8fcf5b585f31186bf81b55added9c102a96f308d640e964ea60f
          stdin: true
          tty: true
          command: ["web-entrypoint.sh"]
          args: ["bin/rails", "server", "-p", "3000", "-b", "::"]
          env:
            - name: RAILS_ENV
              value: development
            - name: APPLICATION_HOSTS
              value: dawarich.item.fyi,dawarich.dawarich.svc.cluster.local
            - name: APPLICATION_PROTOCOL
              value: http
            - name: TIME_ZONE
              value: America/New_York
            - name: REDIS_URL
              value: redis://dawarich-redis:6379
            - name: DATABASE_HOST
              value: dawarich-postgres
            - name: DATABASE_USERNAME
              value: postgres
            - name: DATABASE_NAME
              value: dawarich_development
            - name: MIN_MINUTES_SPENT_IN_CITY
              value: "60"
            - name: SELF_HOSTED
              value: "true"
            - name: STORE_GEODATA
              value: "true"
            - name: PROMETHEUS_EXPORTER_ENABLED
              value: "false"
            # 1.17.0+: background jobs run inside the web process
            # (the separate dawarich-sidekiq deployment was removed).
            # Keep WEB_CONCURRENCY at 0 so jobs share the one web process.
            - name: SIDEKIQ_EMBEDDED
              value: "true"
            - name: WEB_CONCURRENCY
              value: "0"
            - name: OIDC_PROVIDER_NAME
              value: authentik
            - name: OIDC_AUTO_REGISTER
              value: "false"
            - name: ALLOW_EMAIL_PASSWORD_REGISTRATION
              value: "true"
            - name: OIDC_REDIRECT_URI
              value: https://dawarich.item.fyi/users/auth/openid_connect/callback
            - name: OIDC_ISSUER
              value: https://auth.item.fyi/application/o/dawarich/
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich
                  key: DATABASE_PASSWORD
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dawarich
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dawarich
                  key: OIDC_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/app/public
              subPath: public
            - name: data
              mountPath: /var/app/storage
              subPath: storage
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dawarich-data
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich
  namespace: dawarich
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  selector:
    app.kubernetes.io/name: dawarich-app
  ports:
    - port: 80
      targetPort: 3000
      name: http
