        databaseIndex: "1"
        listLength: "1"
    - type: redis
      metadata:
        address: dawarich-redis.dawarich.svc.cluster.local:6379
        listName: queue:visit_suggesting
        databaseIndex: "1"
        listLength: "1"
    - type: redis
      metadata:
        address: dawarich-redis.dawarich.svc.cluster.local:6379
        listName: queue:places
        databaseIndex: "1"
        listLength: "1"
    - type: redis
      metadata:
        address: dawarich-redis.dawarich.svc.cluster.local:6379
