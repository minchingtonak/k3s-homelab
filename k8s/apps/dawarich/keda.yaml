        databaseIndex: "1"
        listLength: "1"
    - type: redis
      metadata:
        address: dawarich-redis.dawarich.svc.cluster.local:6379
        listName: queue:extractions
        databaseIndex: "1"
        listLength: "1"
    - type: redis
      metadata:
        address: dawarich-redis.dawarich.svc.cluster.local:6379
        listName: queue:exports
        databaseIndex: "1"
        listLength: "1"
    - type: redis
      metadata:
        address: dawarich-redis.dawarich.svc.cluster.local:6379
        listName: queue:tracks
        databaseIndex: "1"
        listLength: "1"
    - type: redis
      metadata:
        address: dawarich-redis.dawarich.svc.cluster.local:6379
        listName: queue:stats
        databaseIndex: "1"
        listLength: "1"
    - type: redis
      metadata:
        address: dawarich-redis.dawarich.svc.cluster.local:6379
