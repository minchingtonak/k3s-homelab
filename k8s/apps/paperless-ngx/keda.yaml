apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  target:
    service: paperless-ngx
    port: 80
  rules:
    - hosts:
        - paperless.item.fyi
  timeouts:
    responseHeader: 120s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  scaleTargetRef:
    name: paperless-ngx
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: paperless-ngx
