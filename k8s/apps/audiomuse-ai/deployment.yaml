apiVersion: v1
kind: Namespace
metadata:
  name: audiomuse
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiomuse-postgres
  namespace: audiomuse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audiomuse-config
  namespace: audiomuse
data:
  TZ: America/New_York
  POSTGRES_HOST: audiomuse-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: audiomuse
  POSTGRES_USER: audiomuse
  MEDIASERVER_TYPE: navidrome
  NAVIDROME_URL: http://navidrome.navidrome.svc.cluster.local:4533
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse-postgres
  namespace: audiomuse
  labels:
    app.kubernetes.io/name: audiomuse-postgres
  annotations:
    secret.reloader.stakater.com/reload: audiomuse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
          env:
            - name: POSTGRES_USER
              value: audiomuse
            - name: POSTGRES_DB
              value: audiomuse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audiomuse
                  key: POSTGRES_PASSWORD
            # PGDATA in a subdir so the ext4 lost+found at the Longhorn volume
            # root doesn't make initdb fail ("directory exists but is not empty").
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "audiomuse", "-d", "audiomuse"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: shared-mem
              mountPath: /dev/shm
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: audiomuse-postgres
        - name: shared-mem
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: audiomuse-postgres
  namespace: audiomuse
  annotations:
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
spec:
  selector:
    app.kubernetes.io/name: audiomuse-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse-flask
  namespace: audiomuse
  labels:
    app.kubernetes.io/name: audiomuse-flask
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-flask
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse-flask
    spec:
      containers:
        - name: audiomuse
          image: ghcr.io/neptunehub/audiomuse-ai:3.4.0@sha256:25b104373db717c4465d44e1125fc35c589af9eff97f44b578c1c6923ec55b1f
          env:
            - name: SERVICE_TYPE
              value: flask
          envFrom:
            - configMapRef:
                name: audiomuse-config
            - secretRef:
                name: audiomuse
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: temp-audio
              mountPath: /app/temp_audio
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "6Gi"
      volumes:
        - name: temp-audio
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: audiomuse
  namespace: audiomuse
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  selector:
    app.kubernetes.io/name: audiomuse-flask
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse-worker
  namespace: audiomuse
  labels:
    app.kubernetes.io/name: audiomuse-worker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse-worker
    spec:
      containers:
        - name: audiomuse
          image: ghcr.io/neptunehub/audiomuse-ai:3.4.0@sha256:25b104373db717c4465d44e1125fc35c589af9eff97f44b578c1c6923ec55b1f
          env:
            - name: SERVICE_TYPE
              value: worker
          envFrom:
            - configMapRef:
                name: audiomuse-config
            - secretRef:
                name: audiomuse
          volumeMounts:
            - name: temp-audio
              mountPath: /app/temp_audio
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              # analysis (librosa/CLAP) is CPU- and memory-heavy; give the worker
              # headroom so it isn't OOM-killed mid-track.
              memory: "12Gi"
      volumes:
        - name: temp-audio
          emptyDir: {}
