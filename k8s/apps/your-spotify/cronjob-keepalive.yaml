apiVersion: batch/v1
kind: CronJob
metadata:
  name: your-spotify-keepalive
  namespace: your-spotify
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 330
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: poke
              image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
              args:
                - -sSf
                - --max-time
                - "240"
                - --retry
                - "2"
                - --retry-delay
                - "10"
                - --retry-all-errors
                - https://your-spotify-api.item.fyi/version
              resources:
                requests:
                  memory: 16Mi
                limits:
                  memory: 32Mi
