apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  target:
    service: audiobookshelf
    port: 80
  rules:
    - hosts:
        - audiobookshelf.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  scaleTargetRef:
    name: audiobookshelf
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: audiobookshelf
