apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr
  namespace: seerr
  annotations:
    # expose on separate LoadBalancer/IP to allow access from guest network
    external-dns.alpha.kubernetes.io/target: "192.168.20.91"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Seerr"
    gethomepage.dev/description: "Media request management"
    gethomepage.dev/group: "media"
    gethomepage.dev/icon: "overseerr.png"
    gethomepage.dev/href: "https://seerr.item.fyi"
    gethomepage.dev/siteMonitor: "http://seerr.seerr.svc.cluster.local"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=seerr"
    gethomepage.dev/widget.type: "seerr"
    gethomepage.dev/widget.url: "http://seerr.seerr.svc.cluster.local"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SEERR_TOKEN}}"
spec:
  entryPoints:
    - websecure
    - guest-websecure # reachable from the guest VLAN via 192.168.20.91
  routes:
    - kind: Rule
      match: Host(`seerr.item.fyi`)
      services:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
  tls: {}
