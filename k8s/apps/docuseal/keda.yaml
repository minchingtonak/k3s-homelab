apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: docuseal
  namespace: docuseal
spec:
  target:
    service: docuseal
    port: 80
  rules:
    - hosts:
        - docuseal.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: docuseal
  namespace: docuseal
spec:
  scaleTargetRef:
    name: docuseal
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: docuseal
