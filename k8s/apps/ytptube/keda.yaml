apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: ytptube
  namespace: ytptube
spec:
  target:
    service: ytptube
    port: 80
  rules:
    - hosts:
        - ytptube.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ytptube
  namespace: ytptube
spec:
  scaleTargetRef:
    name: ytptube
  minReplicaCount: 0
  cooldownPeriod: 7200
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: ytptube
