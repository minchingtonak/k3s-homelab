apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: omni-tools
  namespace: omni-tools
spec:
  target:
    service: omni-tools
    port: 80
  rules:
    - hosts:
        - omni-tools.item.fyi
  scalingMetric:
    concurrency:
      targetValue: 30
  timeouts:
    request: 120s
    responseHeader: 60s
    readiness: 90s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: omni-tools
  namespace: omni-tools
spec:
  scaleTargetRef:
    name: omni-tools
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 600
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: omni-tools
