apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: omni-tools
  namespace: omni-tools
spec:
  target:
    service: omni-tools
    port: 80
  rules:
    - hosts:
        - omni-tools.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: omni-tools
  namespace: omni-tools
spec:
  scaleTargetRef:
    name: omni-tools
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: omni-tools
