apiVersion: v1
kind: Namespace
metadata:
  name: trek
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trek-data
  namespace: trek
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trek-uploads
  namespace: trek
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trek
  namespace: trek
  labels:
    app.kubernetes.io/name: trek
  annotations:
    secret.reloader.stakater.com/reload: trek
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trek
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trek
    spec:
      containers:
        - name: trek
          image: mauriceboe/trek:3.4.1@sha256:ce7fab639b89a6f62d484d1175a7d489a536a8c77291f56c03fec20608d4a3eb
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: TZ
              value: America/New_York
            - name: APP_URL
              value: https://trek.item.fyi
            - name: FORCE_HTTPS
              value: "true"
            - name: TRUST_PROXY
              value: "1"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: trek
                  key: ENCRYPTION_KEY
            - name: OIDC_ISSUER
              value: https://auth.item.fyi/application/o/trek/
            - name: OIDC_DISCOVERY_URL
              value: https://auth.item.fyi/application/o/trek/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: trek
            - name: OIDC_DISPLAY_NAME
              value: Authentik
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trek
                  key: OIDC_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trek-data
        - name: uploads
          persistentVolumeClaim:
            claimName: trek-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: trek
  namespace: trek
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  selector:
    app.kubernetes.io/name: trek
  ports:
    - port: 80
      targetPort: 3000
      name: http
