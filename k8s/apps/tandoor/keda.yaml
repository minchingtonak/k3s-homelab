apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: tandoor
  namespace: tandoor
spec:
  target:
    service: tandoor
    port: 80
  rules:
    - hosts:
        - tandoor.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: tandoor
  namespace: tandoor
spec:
  scaleTargetRef:
    name: tandoor
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: tandoor
