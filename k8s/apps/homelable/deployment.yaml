apiVersion: v1
kind: Namespace
metadata:
  name: homelable
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelable-data
  namespace: homelable
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable-backend
  namespace: homelable
  labels:
    app.kubernetes.io/name: homelable-backend
  annotations:
    secret.reloader.stakater.com/reload: homelable-secret
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homelable-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelable-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/pouzor/homelable-backend:3.3.5@sha256:61cdcc68330e1eb58cd7cb0a2c67685c046d26ee3fd64a0cf49ec4a689811fa0
          env:
            - name: TZ
              value: America/New_York
            - name: SQLITE_PATH
              value: /app/data/homelab.db
            - name: FORWARDED_ALLOW_IPS
              value: "*"
            # OIDC mode rejects wildcard CORS; must be the exact browser origin
            - name: CORS_ORIGINS
              value: '["https://homelable.item.fyi"]'
            - name: AUTH_MODE
              value: oidc
            - name: OIDC_DISCOVERY_URL
              value: https://auth.item.fyi/application/o/homelable/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: homelable
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homelable-secret
                  key: OIDC_CLIENT_SECRET
            # must match the redirect_uris entry in the authentik blueprint exactly
            - name: OIDC_REDIRECT_URI
              value: https://homelable.item.fyi/api/v1/auth/oidc/callback
            - name: OIDC_SCOPES
              value: openid profile email
            - name: OIDC_COOKIE_SECURE
              value: "true"
            # signs the app's own session JWT; must be >= 32 bytes in oidc mode
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: homelable-secret
                  key: SECRET_KEY
            - name: SCANNER_RANGES
              value: '["192.168.1.0/24","192.168.20.0/24"]'
            - name: STATUS_CHECKER_INTERVAL
              value: "60"
            # authenticates the mcp sidecar deployment to this backend
            - name: MCP_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: homelable-secret
                  key: MCP_SERVICE_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            capabilities:
              # nmap host discovery and ping-based status checks need raw sockets
              add:
                - NET_RAW
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homelable-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: homelable
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  selector:
    app.kubernetes.io/name: homelable-backend
  ports:
    - port: 8000
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable-frontend
  namespace: homelable
  labels:
    app.kubernetes.io/name: homelable-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homelable-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelable-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/pouzor/homelable-frontend:3.3.5@sha256:720b0d3f9b5083b6cbf63ddb667510609ed9f6914531a82a981c848c22286f42
          env:
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: homelable
  namespace: homelable
  annotations:
    gatus.home-operations.com/endpoint: |
      alerts:
        - type: pushover
spec:
  selector:
    app.kubernetes.io/name: homelable-frontend
  ports:
    - port: 80
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable-mcp
  namespace: homelable
  labels:
    app.kubernetes.io/name: homelable-mcp
  annotations:
    secret.reloader.stakater.com/reload: homelable-secret
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homelable-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelable-mcp
    spec:
      containers:
        - name: mcp
          image: ghcr.io/pouzor/homelable-mcp:3.3.5@sha256:9c09208179487a3e8e6cb3c8f66c6fbc18978e08f90f08d6d7779cf94888c4dc
          env:
            - name: TZ
              value: America/New_York
            - name: BACKEND_URL
              value: http://backend:8000
            # see the backend container: makes uvicorn honor X-Forwarded-Proto,
            # so POST /mcp redirects to https:///mcp/ instead of http:///mcp/
            - name: FORWARDED_ALLOW_IPS
              value: "*"
            # clients (claude code, hermes) send this as the X-API-Key header
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homelable-secret
                  key: MCP_API_KEY
            - name: MCP_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: homelable-secret
                  key: MCP_SERVICE_KEY
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: homelable-mcp
  namespace: homelable
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  selector:
    app.kubernetes.io/name: homelable-mcp
  ports:
    - port: 8001
      targetPort: http
      name: http
