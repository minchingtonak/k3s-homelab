apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: servarr
resources:
  - droppedneedle.yaml
  - ingressroute.yaml
configMapGenerator:
  - name: droppedneedle-plugin-apprise-notifier
    files:
      - plugin.py=scripts/apprise-notifier/plugin.py
      - plugin.toml=scripts/apprise-notifier/plugin.toml
generatorOptions:
  disableNameSuffixHash: true
