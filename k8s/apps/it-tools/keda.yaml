apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: it-tools
  namespace: it-tools
spec:
  target:
    service: it-tools
    port: 80
  rules:
    - hosts:
        - it-tools.item.fyi
  timeouts:
    responseHeader: 30s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: it-tools
  namespace: it-tools
spec:
  scaleTargetRef:
    name: it-tools
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: it-tools
