apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: cyberchef
  namespace: cyberchef
spec:
  target:
    service: cyberchef
    port: 80
  rules:
    - hosts:
        - cyberchef.item.fyi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cyberchef
  namespace: cyberchef
spec:
  scaleTargetRef:
    name: cyberchef
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: cyberchef
