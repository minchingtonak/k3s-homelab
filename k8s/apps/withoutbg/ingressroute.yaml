apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: withoutbg
  namespace: withoutbg
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "WithoutBG"
    gethomepage.dev/description: "Background removal tool"
    gethomepage.dev/group: "tools"
    gethomepage.dev/icon: "sh-withoutbg.svg"
    gethomepage.dev/href: "https://withoutbg.item.fyi"
    gethomepage.dev/siteMonitor: "http://withoutbg.withoutbg.svc.cluster.local"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=withoutbg"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`withoutbg.item.fyi`)
      services:
        # Routed through the KEDA HTTP add-on interceptor, which buffers
        # requests while the app scales up from zero (keda.yaml in this dir).
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
  tls: {}
