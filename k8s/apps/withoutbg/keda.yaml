apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: withoutbg
  namespace: withoutbg
spec:
  target:
    service: withoutbg
    port: 80
  rules:
    - hosts:
        - withoutbg.item.fyi
  timeouts:
    responseHeader: 90s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: withoutbg
  namespace: withoutbg
spec:
  scaleTargetRef:
    name: withoutbg
  minReplicaCount: 0
  triggers:
    - type: external-push
      metadata:
        interceptorRoute: withoutbg
