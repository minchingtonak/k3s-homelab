---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/aqua-yaml.json
# aqua - Declarative CLI Version Manager
# https://aquaproj.github.io/
# checksum:
#   enabled: true
#   require_checksum: true
#   supported_envs:
#   - all
registries:
  - type: standard
    ref: v4.556.0 # renovate: depName=aquaproj/aqua-registry
# Every package carries a `# bin:` annotation listing the executables it
# installs, space-separated. The Makefile parses these to learn what `make
# doctor` should find on PATH, so a package and the commands it provides stay
# described in one place. This is because the command names cannot be inferred
# from the package name
packages:
  - name: dprint/dprint@0.56.1 # bin: dprint
  - name: gitleaks/gitleaks@v8.30.1 # bin: gitleaks
  - name: astral-sh/uv@0.12.8 # bin: uv uvx
  - name: getsops/sops@v3.13.3 # bin: sops
  - name: kubernetes/kubernetes/kubectl@v1.37.0 # bin: kubectl
  - name: fluxcd/flux2@v2.9.5 # bin: flux
